<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#080b14">
<title>NEXORA V1</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#070910;color:#e8edf7;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:active{transform:scale(.98)}
.app{width:100%;max-width:1050px;margin:auto;min-height:100vh}
.screen{padding:18px}
.hidden{display:none!important}

.start{
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at 50% 20%,rgba(91,83,180,.22),transparent 35%),
 linear-gradient(180deg,#090b17,#05060b);
}
.startbox{
 width:100%;max-width:560px;text-align:center;padding:30px 22px;
 border:1px solid #303852;border-radius:24px;background:rgba(13,17,30,.94);
 box-shadow:0 20px 70px rgba(0,0,0,.45)
}
.logo{font-size:46px;font-weight:900;letter-spacing:8px;color:#dfe6ff}
.subtitle{color:#8994ae;margin-top:8px}
.version{font-size:12px;color:#68738e;margin-top:14px}
.primary{
 border:0;border-radius:12px;padding:14px 18px;background:#6d63d9;color:white;
 font-weight:bold;width:100%;margin-top:18px
}
.secondary{
 border:1px solid #343c55;background:#151a2a;color:#dbe2f5;
 border-radius:10px;padding:11px 14px
}
.danger{border-color:#63343b;color:#ffb7bd}
.start-actions{margin-top:25px}
.start-actions button{display:block}
.start-actions button+button{margin-top:9px}

.top{
 display:flex;gap:12px;align-items:center;justify-content:space-between;
 padding:14px 18px;border-bottom:1px solid #20273a;
 background:#0a0d17;position:sticky;top:0;z-index:5
}
.brand{font-weight:900;letter-spacing:3px}
.level{font-size:12px;color:#929cb4}
.topright{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.smallbtn{padding:8px 10px;font-size:12px}

.panel{
 background:#0e1320;border:1px solid #242c42;border-radius:16px;
 padding:16px;margin-bottom:14px
}
.panel h2,.panel h3{margin:0 0 12px}
.muted{color:#8993aa;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:650px){
 .grid,.grid3{grid-template-columns:1fr}
 .logo{font-size:36px;letter-spacing:5px}
 .top{align-items:flex-start}
}

.label{font-size:12px;color:#8993aa;margin-bottom:6px;display:block}
input,textarea,select{
 width:100%;background:#080c16;color:#edf1fb;border:1px solid #303950;
 border-radius:10px;padding:12px;outline:none
}
textarea{resize:vertical;min-height:90px}
input:focus,textarea:focus,select:focus{border-color:#7770e5}

.choice{
 border:1px solid #2d354c;background:#111725;border-radius:12px;padding:13px;
 color:#e9edf8;text-align:left;width:100%;transition:.15s
}
.choice:hover{border-color:#6c67c9}
.choice.selected{border-color:#8983ff;background:#1a1c35;box-shadow:0 0 0 1px #8983ff inset}
.choice b{display:block;margin-bottom:4px}
.choice span{font-size:12px;color:#929bb1;line-height:1.45}

.setup-title{font-size:24px;font-weight:900;margin-bottom:5px}
.step{color:#78839b;font-size:12px;margin-bottom:20px}
.statline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #1e2536}
.statline:last-child{border:0}
.statname{color:#929cb2}

.hpbar,.expbar{
 height:9px;background:#20283a;border-radius:20px;overflow:hidden;margin-top:7px
}
.hpfill{height:100%;background:#c84e61}
.expfill{height:100%;background:#6374df}

.tag{
 display:inline-block;padding:5px 8px;border-radius:20px;
 background:#1b2133;border:1px solid #303950;color:#abb4c9;font-size:11px;margin:2px
}

.location{
 min-height:130px;padding:18px;border-radius:16px;border:1px solid #303850;
 background:
 radial-gradient(circle at 80% 20%,rgba(102,96,210,.22),transparent 30%),
 linear-gradient(135deg,#11192a,#0a0e18)
}
.location-name{font-size:24px;font-weight:900}
.location-desc{color:#929db4;font-size:13px;line-height:1.55;margin-top:6px}

.rp{
 max-height:430px;overflow-y:auto;padding:12px;
 background:#070a11;border-radius:12px;border:1px solid #20283a
}
.msg{margin-bottom:15px;line-height:1.6}
.msg .who{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#737e98;margin-bottom:4px}
.msg.player .who{color:#9e98ff}
.msg.arbiter .who{color:#b5a46b}
.msg.npc .who{color:#79b6d9}
.msg.system .who{color:#72bf91}
.msg .body{white-space:pre-wrap}
.typing{color:#68738d;font-style:italic}

.rpform{margin-top:10px}
.rpbuttons{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.rpbuttons button{flex:1;min-width:130px}

.quest{
 padding:13px;border:1px solid #293249;border-radius:12px;
 background:#101625;margin-bottom:9px
}
.quest-title{font-weight:bold}
.quest-meta{font-size:11px;color:#7f8ba4;margin-top:4px}
.quest-desc{font-size:13px;color:#aeb7c9;margin-top:7px;line-height:1.45}

.item{
 display:flex;justify-content:space-between;gap:12px;
 padding:10px 0;border-bottom:1px solid #20283a
}
.item:last-child{border-bottom:0}
.item-name{font-weight:bold}
.item-desc{font-size:11px;color:#7f8ba3;margin-top:3px}
.item-right{text-align:right;white-space:nowrap}

.toast{
 position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
 background:#151b2b;border:1px solid #414b69;border-radius:12px;
 padding:12px 16px;z-index:99;max-width:90%;box-shadow:0 10px 40px #0008
}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}
.tab{padding:10px 6px;font-size:11px}
.tab.active{background:#292748;border-color:#7069dc}

.cardstat{padding:12px;background:#111726;border:1px solid #293248;border-radius:12px}
.big{font-size:22px;font-weight:900}
.gold{color:#e6c36e}
.good{color:#79ca98}
.bad{color:#df7180}

.worldrow{
 display:flex;justify-content:space-between;gap:10px;align-items:center;
 padding:12px 0;border-bottom:1px solid #20283a
}
.worldrow:last-child{border:0}

.skill{
 border:1px solid #2c354b;background:#111725;border-radius:12px;padding:12px
}
.skill.locked{opacity:.45}
.skill b{display:block}
.skill small{display:block;color:#8590a8;margin-top:5px;line-height:1.4}

.footer{text-align:center;color:#59637a;font-size:11px;padding:20px}
</style>
</head>

<body>
<div id="app" class="app">

<!-- START -->
<section id="startScreen" class="start">
 <div class="startbox">
  <div class="logo">NEXORA</div>
  <div class="subtitle">An Open-World Fantasy Roleplay</div>
  <div class="version">VERSION 1 • AI ARBITER EDITION</div>

  <div class="start-actions">
   <button class="primary" id="newGameBtn">MULAI PETUALANGAN</button>
   <button class="secondary" id="continueBtn">LANJUTKAN PETUALANGAN</button>
   <button class="secondary danger" id="resetBtn">HAPUS SAVE</button>
  </div>

  <div class="footer">
   Dunia berubah berdasarkan tindakanmu.<br>
   "Dialog" • [Aksi] • Bebaskan ceritamu.
  </div>
 </div>
</section>

<!-- SETUP -->
<section id="setupScreen" class="screen hidden">
 <div class="panel">
  <div class="setup-title">Penciptaan Karakter</div>
  <div class="step" id="setupStep">Langkah 1 / 3</div>

  <div id="setupName">
   <label class="label">Nama karakter</label>
   <input id="nameInput" maxlength="24" placeholder="Masukkan nama karaktermu">
   <button class="primary" id="nameNext">Lanjut</button>
  </div>

  <div id="setupRace" class="hidden">
   <h3>Pilih Race</h3>
   <div id="raceGrid" class="grid"></div>
   <button class="primary" id="raceNext">Lanjut</button>
  </div>

  <div id="setupClass" class="hidden">
   <h3>Pilih Class</h3>
   <div id="classGrid" class="grid"></div>
   <button class="primary" id="createBtn">MULAI DUNIA NEXORA</button>
  </div>
 </div>
</section>

<!-- GAME -->
<section id="gameScreen" class="hidden">
 <header class="top">
  <div>
   <div class="brand">NEXORA</div>
   <div id="topPlayer" class="level"></div>
  </div>
  <div class="topright">
   <button class="secondary smallbtn" id="profileBtn">PLAYER</button>
   <button class="secondary smallbtn" id="worldBtn">WORLD</button>
   <button class="secondary smallbtn" id="questBtn">QUEST</button>
   <button class="secondary smallbtn" id="bagBtn">BAG</button>
   <button class="secondary smallbtn" id="aiBtn">AI</button>
  </div>
 </header>

 <main class="screen">

  <div id="mainPanel"></div>

  <div id="modalPanel" class="hidden"></div>

  <div class="footer">
   NEXORA V1 • AI Arbiter Roleplay Engine
  </div>
 </main>
</section>

<div id="toast" class="toast hidden"></div>
</div>

function save(){

}

function load(){

/* ---------- HELPERS ---------- */

function $(id){return document.getElementById(id)}

function esc(s){
 s=String(s==null?"":s);
 return s.replace(/&/g,"&amp;")
         .replace(/</g,"&lt;")
         .replace(/>/g,"&gt;")
         .replace(/"/g,"&quot;");
}

function notify(text){
 var t=$("toast");
 t.innerHTML=esc(text);
 t.className="toast";
 setTimeout(function(){t.className="toast hidden"},2300);
}

function getRace(){
 for(var i=0;i<RACES.length;i++){
  if(RACES[i].id===state.player.race){return RACES[i]}
 }
 return null;
}

function getClass(){
 for(var i=0;i<CLASSES.length;i++){
  if(CLASSES[i].id===state.player.class){return CLASSES[i]}
 }
 return null;
}

function getLocation(){
 for(var i=0;i<LOCATIONS.length;i++){
  if(LOCATIONS[i].id===state.location){return LOCATIONS[i]}
 }
 return LOCATIONS[0];
}

function getMonster(id){
 for(var i=0;i<MONSTERS.length;i++){
  if(MONSTERS[i].id===id){return MONSTERS[i]}
 }
 return MONSTERS[0];
}

function getItemPrice(name){
 for(var i=0;i<ITEMS.length;i++){
  if(ITEMS[i][0]===name){return ITEMS[i][2]}
 }
 return 10;
}

function addItem(name,n){
 if(!state.inventory[name])state.inventory[name]=0;
 state.inventory[name]+=n;
}

function hasItem(name,n){
 return (state.inventory[name]||0)>=n;
}

function spendGold(n){
 if(state.player.gold<n){
  notify("Gold tidak cukup.");
  return false;
 }
 state.player.gold-=n;
 return true;
}

function gainExp(n){
 var p=state.player;
 p.exp+=n;
 notify("EXP +" + n);
 while(p.exp>=p.expNext){
  p.exp-=p.expNext;
  p.level++;
  p.expNext=Math.floor(p.expNext*1.22)+25;
  p.statPoints+=6;
  p.maxHp+=12;
  p.maxMp+=6;
  p.maxStamina+=5;
  p.hp=p.maxHp;
  p.mp=p.maxMp;
  p.stamina=p.maxStamina;
  notify("LEVEL UP! Level " + p.level + " • +6 Stat Point");
 }
}

function addRep(f,n){
 if(!state.reputation[f])state.reputation[f]=0;
 state.reputation[f]+=n;
 if(n>0)notify(f+" Reputation +" + n);
}

function addHistory(text){
 state.history.push({
  day:state.world.day,
  location:state.location,
  text:text
 });
 if(state.history.length>80)state.history.shift();
}

function generateQuests(){
 var p=state.player;
 var list=[];
 var seed=new Date().getDate()+new Date().getMonth()*31+p.level;

 var templates=[
  {type:"hunt",title:"Federation Hunt",desc:"Kalahkan 3 monster di wilayah yang sesuai levelmu.",need:3,target:"monster",reward:220,exp:180,rep:4},
  {type:"gather",title:"Gathering Request",desc:"Kumpulkan 5 material dari alam.",need:5,target:"material",reward:180,exp:150,rep:3},
  {type:"mine",title:"Mine Supply",desc:"Tambang 4 ore untuk persediaan Federation.",need:4,target:"ore",reward:260,exp:220,rep:5},
  {type:"fish",title:"Coastal Supply",desc:"Tangkap 4 ikan dari area laut.",need:4,target:"fish",reward:240,exp:200,rep:4},
  {type:"delivery",title:"Urgent Delivery",desc:"Antarkan pesan ke lokasi tujuan.",need:1,target:"travel",reward:300,exp:250,rep:6},
  {type:"investigate",title:"Strange Rumor",desc:"Cari tahu sumber kejadian misterius melalui RP.",need:1,target:"rp",reward:350,exp:300,rep:8},
  {type:"rescue",title:"Rescue Mission",desc:"Bantu seseorang yang ditemui dalam perjalanan.",need:1,target:"rp",reward:400,exp:350,rep:10},
  {type:"dungeon",title:"Dungeon Expedition",desc:"Masuki dungeon dan selesaikan ekspedisi.",need:1,target:"dungeon",reward:600,exp:500,rep:12},
  {type:"arena",title:"Royal Arena Trial",desc:"Menangkan satu pertarungan arena.",need:1,target:"arena",reward:500,exp:450,rep:7},
  {type:"craft",title:"Smithing Request",desc:"Buat atau upgrade sebuah equipment.",need:1,target:"craft",reward:300,exp:250,rep:5},
  {type:"reality",title:"Reality Quest",desc:"Arbiter akan memberikan situasi dinamis yang berubah berdasarkan tindakanmu.",need:1,target:"rp",reward:700,exp:650,rep:12}
 ];

 for(var i=0;i<templates.length;i++){
  var t=templates[(i+seed)%templates.length];
  list.push({
   id:"Q"+Date.now()+"_"+i,
   type:t.type,
   title:t.title,
   desc:t.desc,
   need:t.need,
   progress:0,
   target:t.target,
   reward:t.reward+p.level*15,
   exp:t.exp+p.level*12,
   rep:t.rep,
   done:false
  });
 }
 return list;
}

function questProgress(target,n){
 for(var i=0;i<state.quests.length;i++){
  var q=state.quests[i];
  if(q.done)continue;
  if(q.target===target){
   q.progress+=n;
   if(q.progress>q.need)q.progress=q.need;
   if(q.progress>=q.need){
    completeQuest(q);
   }
  }
 }
}

function completeQuest(q){
 if(q.done)return;
 q.done=true;
 state.player.gold+=q.reward;
 gainExp(q.exp);
 addRep("federation",q.rep);
 state.completed.push(q.title);
 addHistory("Quest selesai: "+q.title);
 notify("Quest selesai! Gold +"+q.reward);
 save();
}

function refreshQuests(){
 var active=0;
 for(var i=0;i<state.quests.length;i++){
  if(!state.quests[i].done)active++;
 }
 if(active<5){
  var fresh=generateQuests();
  for(var j=0;j<fresh.length && active<8;j++){
   state.quests.push(fresh[j]);
   active++;
  }
 }
}

function startRandomCombat(){
 var p=state.player;
 var available=[];
 for(var i=0;i<MONSTERS.length;i++){
  var m=MONSTERS[i];
  if(m.level<=p.level+3 && m.level>=Math.max(1,p.level-4))available.push(m);
 }

 if(available.length===0)available=[MONSTERS[0]];

 var m=available[Math.floor(Math.random()*available.length)];
 startCombatObject(m,false);
}

function startCombatObject(enemy,isArena){
 if(state.combat){
  notify("Kamu sedang bertarung.");
  return;
 }

 state.combat={
  enemy:{
   name:enemy.name,
   level:enemy.level,
   hp:enemy.hp,
   maxHp:enemy.hp,
   atk:enemy.atk,
   def:enemy.def,
   exp:enemy.exp||0,
   gold:enemy.gold||0,
   drop:enemy.drop||"Arena Token"
  },
  arena:isArena,
  defending:false,
  log:[]
 };

 currentTab="combat";
 renderCombat();
}

 var p=state.player;

function playerAttackDamage(){
 var p=state.player;
 var weaponBonus=5;
 for(var i=0;i<WEAPONS.length;i++){
  if(WEAPONS[i][0]===p.equipped){
   weaponBonus=WEAPONS[i][2];
  }
 }
 return Math.max(1,p.stats.str*2+weaponBonus+Math.floor(Math.random()*8));
}

function enemyTurn(){
 var c=state.combat;
 var p=state.player;
 var e=c.enemy;

 var dmg=Math.max(1,e.atk-p.stats.vit-Math.floor(Math.random()*5));
 if(c.defending)dmg=Math.floor(dmg*.45);

 p.hp-=dmg;
 c.log.push(e.name+" menyerang. Damage "+dmg+".");

 if(p.hp<=0){
  p.hp=1;
  c.log.push("Kamu jatuh dan kehilangan kesempatan.");
  state.player.gold=Math.max(0,state.player.gold-Math.floor(state.player.gold*.08));
  state.combat=null;
  currentTab="home";
  save();
  notify("Kalah. Sebagian Gold hilang.");
  renderGame();
 }
}

function combatAttack(){
 if(!state.combat)return;
 var c=state.combat;
 var e=c.enemy;
 var dmg=playerAttackDamage();
 dmg=Math.max(1,dmg-e.def);
 e.hp-=dmg;
 c.log.push("Kamu menyerang "+e.name+". Damage "+dmg+".");
 c.defending=false;

 if(e.hp<=0){
  winCombat();
  return;
 }
 enemyTurn();
 if(state.combat)renderCombat();
}

function combatDefend(){
 if(!state.combat)return;
 state.combat.defending=true;
 state.combat.log.push("Kamu mengambil posisi bertahan.");
 enemyTurn();
 if(state.combat)renderCombat();
}

function combatSkill(){
 if(!state.combat)return;
 var p=state.player;
 var c=state.combat;
 var e=c.enemy;

 if(p.skills.length===0){
  notify("Tidak ada skill.");
  return;
 }

 var sName=p.skills[Math.floor(Math.random()*p.skills.length)];
 var power=20+Math.floor(p.stats.int*1.5+p.stats.str+Math.random()*15);
 var dmg=Math.max(2,power-e.def);

 if(sName==="Heal"){
  var heal=30+p.stats.int*2;
  p.hp=Math.min(p.maxHp,p.hp+heal);
  c.log.push("Kamu menggunakan Heal. HP +"+heal+".");
 }else{
  e.hp-=dmg;
  p.mp=Math.max(0,p.mp-5);
  c.log.push("Kamu menggunakan "+sName+". Damage "+dmg+".");
 }

 if(e.hp<=0){
  winCombat();
  return;
 }

 enemyTurn();
 if(state.combat)renderCombat();
}

function combatRun(){
 if(!state.combat)return;
 if(Math.random()<.65){
  state.combat=null;
  currentTab="home";
  notify("Kamu berhasil kabur.");
  renderGame();
 }else{
  state.combat.log.push("Kamu gagal melarikan diri.");
  enemyTurn();
  if(state.combat)renderCombat();
 }
}

function winCombat(){
 var c=state.combat;
 var e=c.enemy;
 var p=state.player;

 p.hp=Math.min(p.maxHp,p.hp+10);

 var exp=e.exp||100;
 var gold=e.gold||50;

 p.gold+=gold;
 gainExp(exp);

 var drop=e.drop||"Arena Token";
 addItem(drop,1);

 if(c.arena){
  addItem("Arena Token",2);
  addRep("royal",3);
  questProgress("arena",1);
 }

 questProgress("monster",1);

 addHistory("Kemenangan melawan "+e.name+". Reward: "+exp+" EXP, "+gold+" Gold, "+drop+".");
 save();

 state.combat=null;
 currentTab="home";

 notify("MENANG! EXP +"+exp+" • Gold +"+gold+" • "+drop+" x1");
 renderGame();
}

/* ---------- RP / ARBITER ---------- */

function parseRP(text){
 var dialog=[];
 var actions=[];
 var clean=text;

 var quoteRe=/"([^"]*)"/g;
 var m;
 while((m=quoteRe.exec(text))!==null){
  dialog.push(m[1]);
 }

 var actionRe=/\[([^\]]*)\]/g;
 while((m=actionRe.exec(text))!==null){
  actions.push(m[1]);
 }

 return {dialog:dialog,actions:actions,raw:text,clean:clean};
}

function localArbiter(parsed){
 var p=state.player;
 var l=getLocation();
 var text=parsed.raw.toLowerCase();
 var result="";

 var hasAction=parsed.actions.length>0;
 var hasDialog=parsed.dialog.length>0;

 if(text.indexOf("tavern")>=0 || text.indexOf("bar")>=0){
  result="Pintu tavern terbuka di hadapanmu. Kehangatan, aroma makanan, dan suara percakapan memenuhi ruangan. Seorang bartender memperhatikanmu.";
  if(hasDialog)result+="\n\nBartender: \"Kalau kau mencari pekerjaan, Federation sering mengirim petualang ke sini.\"";
  addRep("tavern",1);
  return result;
 }

 if(text.indexOf("federation")>=0 || text.indexOf("quest")>=0 || text.indexOf("pekerjaan")>=0){
  result="Seorang petugas Federation menatapmu dari balik meja.\n\nPetugas: \"Kalau kau ingin mengambil pekerjaan, buktikan dulu bahwa kau bisa bertanggung jawab atas keputusanmu.\"";
  questProgress("rp",1);
  return result;
 }

 if(text.indexOf("serang")>=0 || text.indexOf("bunuh")>=0 || text.indexOf("pedang")>=0){
  result="Gerakanmu membuat suasana berubah. Orang-orang di sekitar mulai memperhatikan. Dunia bereaksi terhadap tindakanmu.";
  if(l.type==="Capital"){
   result+="\n\nPenjaga kota: \"Simpan senjatamu. Jangan membuat keributan di dalam kota.\"";
  }else{
   result+="\n\nSesuatu dari balik pepohonan mulai bergerak...";
  }
  return result;
 }

 if(text.indexOf("bantu")>=0 || text.indexOf("menolong")>=0){
  result="Kau memilih untuk membantu. Orang yang berada di hadapanmu tampak terkejut karena tidak menyangka seorang petualang akan turun tangan.";
  addRep("federation",3);
  questProgress("rp",1);
  return result;
 }

 if(text.indexOf("pergi")>=0 || text.indexOf("jalan")>=0){
  result="Kau melanjutkan perjalanan. Suasana berubah ketika jarak dari tempat sebelumnya semakin jauh.";
  return result;
 }

 if(l.type==="Forest"){
  result="Hutan "+l.name+" berbisik diterpa angin. Daun bergerak tanpa suara yang jelas. Sesuatu mungkin sedang mengawasimu.";
 }else if(l.type==="Sea" || l.type==="Port City"){
  result="Angin laut menerpa wajahmu. Kapal-kapal bergerak perlahan di kejauhan sementara para pelaut berteriak membawa barang.";
 }else if(l.type==="Ruins"){
  result="Reruntuhan tua berdiri dalam keheningan. Simbol yang hampir terkikis terlihat di salah satu dinding.";
 }else if(l.type==="Mine"){
  result="Suara logam menghantam batu terdengar dari dalam tambang. Udara terasa lebih berat semakin dalam kau berjalan.";
 }else if(l.type==="Snow"){
  result="Salju turun perlahan. Jejak kaki makhluk besar terlihat di kejauhan.";
 }else if(l.type==="Abyss"){
  result="Udara di Abyss Gate terasa berbeda. Cahaya seolah kehilangan kekuatannya. Sesuatu dari balik gerbang memperhatikanmu.";
 }else{
  result="Dunia tetap bergerak di sekitarmu. NPC berbicara, pedagang bertransaksi, dan para petualang menjalani urusannya masing-masing.";
 }

 if(hasAction)result+="\n\nArbiter mencatat tindakanmu. Keputusan ini dapat memengaruhi kejadian berikutnya.";
 if(hasDialog)result+="\n\nArbiter memahami ucapanmu dan dunia menunggu respons berikutnya.";

 return result;
}

function sendRoleplay(){
 if(typing)return;

 var input=$("rpInput");
 var text=input.value.replace(/^\s+|\s+$/g,"");

 if(!text){
  notify("Tulis dialog atau aksi terlebih dahulu.");
  return;
 }

 var parsed=parseRP(text);

 addHistory("Kamu: "+text);

 input.value="";
 typing=true;
 renderGame();

 setTimeout(function(){
  useArbiter(parsed);
 },350);
}

function useArbiter(parsed){
 var endpoint=state.ai.endpoint;

 if(endpoint){
  callOnlineArbiter(endpoint,parsed);
 }else{
  var answer=localArbiter(parsed);
  finishArbiter(answer);
 }
}

 ].join("\n");
}

function callOnlineArbiter(endpoint,parsed){
 var payload={
  game:"NEXORA V1",
  system:"AI Arbiter fantasy roleplay",
  prompt:buildPrompt(parsed),
  player:{
   name:state.player.name,
   race:state.player.race,
   class:state.player.class,
   level:state.player.level,
   location:getLocation().name
  }
 };

 try{
  var xhr=new XMLHttpRequest();
  xhr.open("POST",endpoint,true);
  xhr.setRequestHeader("Content-Type","application/json");

  xhr.onreadystatechange=function(){
   if(xhr.readyState!==4)return;

   if(xhr.status>=200 && xhr.status<300){
    try{
     var data=JSON.parse(xhr.responseText);
     var answer="";

     if(data.reply)answer=data.reply;
     else if(data.response)answer=data.response;
     else if(data.message)answer=data.message;
     else if(data.content)answer=data.content;
     else if(data.choices && data.choices[0]){
      if(data.choices[0].message)answer=data.choices[0].message.content;
      else if(data.choices[0].text)answer=data.choices[0].text;
     }

     if(answer){
      state.ai.lastError="";
      finishArbiter(answer);
      return;
     }
    }catch(e){}
   }

   state.ai.lastError="AI endpoint gagal. Local Arbiter digunakan.";
   var fallback=localArbiter(parsed);
   finishArbiter(fallback);
  };

  xhr.onerror=function(){
   state.ai.lastError="Koneksi AI gagal. Local Arbiter digunakan.";
   finishArbiter(localArbiter(parsed));
  };

  xhr.ontimeout=function(){
   state.ai.lastError="AI timeout. Local Arbiter digunakan.";
   finishArbiter(localArbiter(parsed));
  };

  xhr.timeout=12000;
  xhr.send(JSON.stringify(payload));

 }catch(e){
  state.ai.lastError="AI tidak dapat dihubungi. Local Arbiter digunakan.";
  finishArbiter(localArbiter(parsed));
 }
}

function finishArbiter(answer){
 typing=false;

 if(!answer)answer="Arbiter terdiam sejenak. Dunia tetap bergerak.";

 addHistory(answer);

 /* RP actions can influence quest progress */
 var lower=answer.toLowerCase();

 if(lower.indexOf("quest")>=0)questProgress("rp",1);
 if(lower.indexOf("federation")>=0)addRep("federation",1);

 save();

 currentTab="home";
 renderGame();
}

/* ---------- GATHERING ---------- */

function gather(type){
 var loc=getLocation();

 if(type==="forest"){
  if(loc.type!=="Forest"){
   notify("Pergilah ke area Forest.");
   return;
  }
  addItem("Wood",2+Math.floor(Math.random()*3));
  addItem("Herb",1+Math.floor(Math.random()*2));
  questProgress("material",1);
  gainExp(20);
  notify("Gathering berhasil.");
 }

 if(type==="mine"){
  if(loc.type!=="Mine"){
   notify("Pergilah ke Mine.");
   return;
  }
  var ores=["Iron Ore","Copper Ore","Silver Ore"];
  var ore=ores[Math.floor(Math.random()*ores.length)];
  addItem(ore,1+Math.floor(Math.random()*2));
  questProgress("ore",1);
  gainExp(35);
  notify("Menambang "+ore+".");
 }

 if(type==="fish"){
  if(loc.type!=="Sea" && loc.type!=="Port City"){
   notify("Pergilah ke area laut/pelabuhan.");
   return;
  }
  var fish=["Fresh Fish","Crab Shell","Blue Coral","Pearl"];
  var f=fish[Math.floor(Math.random()*fish.length)];
  addItem(f,1);
  questProgress("fish",1);
  gainExp(30);
  notify("Fishing mendapatkan "+f+".");
 }

 save();
 renderGame();
}

/* event delegation for stats */
$("mainPanel").onclick=function(e){
 var target=e.target;

 if(target && target.getAttribute("data-stat")){
  var key=target.getAttribute("data-stat");
  if(state.player.statPoints<=0)return;

  state.player.stats[key]++;
  state.player.statPoints--;

  if(key==="vit"){
   state.player.maxHp+=5;
   state.player.hp=Math.min(state.player.maxHp,state.player.hp+5);
  }
  if(key==="int"){
   state.player.maxMp+=3;
   state.player.mp=Math.min(state.player.maxMp,state.player.mp+3);
  }

  save();
  renderGame();
 }
};
