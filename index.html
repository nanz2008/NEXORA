<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#080b14">
<title>NEXORA — Open World Fantasy RPG</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#070a11;color:#eef3ff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;background:
radial-gradient(circle at 50% -10%,#26365b 0,#111827 35%,#070a11 75%);overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.hidden{display:none!important}

:root{
 --bg:#070a11;
 --panel:#0e1421;
 --card:#121a2a;
 --border:#293750;
 --text:#eef3ff;
 --muted:#93a0b8;
 --blue:#79aaff;
 --gold:#e3bf6c;
 --green:#62d49b;
 --red:#e06d78;
 --purple:#b68cff;
}

.app{max-width:1080px;margin:auto;padding:12px}
.top{
 display:flex;align-items:center;justify-content:space-between;
 padding:8px 4px 12px;position:sticky;top:0;z-index:50;
 background:rgba(7,10,17,.94);backdrop-filter:blur(10px)
}
.logo{font-weight:1000;font-size:25px;letter-spacing:3px}
.logo span{color:var(--blue)}
.topright{display:flex;gap:7px;align-items:center}
.pill{
 border:1px solid var(--border);background:#11192a;
 padding:7px 10px;border-radius:99px;font-size:12px
}
.iconbtn{
 border:1px solid var(--border);background:#11192a;color:white;
 border-radius:11px;width:40px;height:38px
}

.screen{min-height:calc(100vh - 70px)}
.hero{
 border:1px solid var(--border);border-radius:22px;padding:20px;
 margin-bottom:12px;background:linear-gradient(145deg,#172238,#0c111d);
 box-shadow:0 14px 45px #0007
}
.card{
 background:var(--card);border:1px solid var(--border);
 border-radius:16px;padding:15px;box-shadow:0 7px 24px #0004
}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

h1{font-size:32px;margin:6px 0 12px}
h2{font-size:23px;margin:5px 0 12px}
h3{margin:0 0 8px}
p{line-height:1.55}
.muted{color:var(--muted);font-size:13px}
.eyebrow{
 color:#8fa8d2;font-size:10px;letter-spacing:3px;
 font-weight:bold;text-transform:uppercase
}
.big{font-size:27px;font-weight:1000}
.section{
 font-size:13px;color:#aab8d0;font-weight:bold;
 margin:15px 2px 8px
}

.btn{
 width:100%;border:0;border-radius:12px;padding:12px;
 margin-top:9px;background:var(--blue);color:#07101e;font-weight:900
}
.btn.alt{
 background:#182237;color:#edf3ff;border:1px solid #33425f
}
.btn.gold{background:var(--gold);color:#211706}
.btn.green{background:var(--green);color:#07170f}
.btn.red{background:var(--red);color:white}
.btn.purple{background:var(--purple);color:#160b26}

.titleScreen{
 min-height:92vh;display:grid;place-items:center;text-align:center
}
.titleLogo{
 font-size:58px;font-weight:1000;letter-spacing:8px;
 text-shadow:0 0 35px #6e9cff77
}
.titleLogo span{color:var(--blue)}
.subtitle{color:#98a8c5;letter-spacing:5px;font-size:11px;margin:8px 0 28px}
.sigil{font-size:72px;margin-bottom:2px}

.field{display:grid;gap:6px;margin:10px 0}
.field label{font-size:11px;color:#9eabc2}
input,select,textarea{
 width:100%;background:#090f1a;color:white;border:1px solid #34425e;
 padding:11px;border-radius:11px;outline:none
}
textarea{min-height:85px;resize:vertical}

.choice{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.choice button{
 background:#111a2a;color:#dfe8fa;border:1px solid #30405d;
 border-radius:12px;padding:12px;text-align:left
}
.choice button.selected{
 border-color:var(--blue);background:#1a2b4b;
 box-shadow:0 0 0 1px #79aaff44 inset
}

.bar{height:9px;background:#252d3d;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.bar.hp i{background:var(--green)}
.bar.enemy i{background:var(--red)}
.bar.xp i{background:var(--purple)}

.stat{
 display:flex;justify-content:space-between;align-items:center;
 padding:9px 0;border-bottom:1px solid #202b40
}
.stat:last-child{border-bottom:0}

.nav{
 display:grid;grid-template-columns:repeat(6,1fr);gap:5px;
 position:sticky;bottom:6px;z-index:40;margin-top:13px;
 padding:6px;background:#080d16ed;border:1px solid #27344d;
 border-radius:16px;backdrop-filter:blur(10px)
}
.nav button{
 border:0;background:#111827;color:#9caac2;border-radius:10px;
 padding:9px 3px;font-size:10px
}
.nav button.active{background:#253654;color:white}

.map{
 min-height:390px;border:1px solid #3b4962;border-radius:20px;
 position:relative;overflow:hidden;
 background:
 radial-gradient(circle at 30% 25%,#344c3e 0,transparent 20%),
 radial-gradient(circle at 75% 70%,#4b3e34 0,transparent 22%),
 linear-gradient(145deg,#182c2c,#101c29 55%,#151425)
}
.map:before,.map:after{
 content:"";position:absolute;inset:-30%;
 background:linear-gradient(25deg,transparent 48%,#6a705855 49%,#6a705855 50%,transparent 51%);
 transform:rotate(12deg);opacity:.4
}
.map:after{transform:rotate(-18deg);opacity:.25}
.location{
 position:absolute;z-index:4;transform:translate(-50%,-50%);
 min-width:88px;padding:8px;border-radius:13px;
 background:#0c1422eF;color:white;border:1px solid #55657f;
 text-align:center;font-size:10px;box-shadow:0 7px 20px #0009
}
.location b{display:block;font-size:24px}
.l1{left:50%;top:48%}
.l2{left:22%;top:25%}
.l3{left:77%;top:24%}
.l4{left:18%;top:67%}
.l5{left:50%;top:78%}
.l6{left:80%;top:65%}
.l7{left:32%;top:51%}
.l8{left:68%;top:47%}
.l9{left:55%;top:19%}
.l10{left:90%;top:40%}
.l11{left:8%;top:43%}
.l12{left:38%;top:82%}

.placeIcon{
 width:48px;height:48px;border-radius:14px;
 display:grid;place-items:center;background:#202d44;font-size:25px
}
.placeRow{display:flex;gap:10px;align-items:center}

.tag{
 display:inline-block;padding:4px 7px;border-radius:99px;
 background:#1b2940;color:#a8c6ff;font-size:9px;margin:2px
}
.tag.gold{background:#3b301d;color:#f0cf78}
.tag.green{background:#173629;color:#7de0ac}
.tag.red{background:#3b2026;color:#ff9ca4}
.tag.purple{background:#302343;color:#c8a9ff}

.item{
 display:flex;justify-content:space-between;gap:8px;
 align-items:center;padding:9px 0;border-bottom:1px solid #202b40
}
.item:last-child{border-bottom:0}

.skill{
 background:#10192a;border:1px solid #31415d;
 padding:11px;border-radius:13px
}
.skill.locked{opacity:.45}
.skill.active{border-color:var(--gold);background:#2b2519}

.skillgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.combat{
 background:
 radial-gradient(circle at 50% 10%,#402b46 0,#191522 42%,#090c13 100%);
 border-color:#543c62
}
.enemyArt{
 min-height:175px;display:grid;place-items:center;text-align:center;
 position:relative
}
.monster{
 width:135px;height:135px;border-radius:50%;
 display:grid;place-items:center;font-size:78px;
 background:radial-gradient(circle,#5c4b75,#211b32 65%,#0c0d15);
 border:2px solid #735d8e;
 box-shadow:0 0 50px #7d61a655
}
.enemyName{font-size:19px;font-weight:900;margin-top:8px}
.rec{
 display:inline-block;margin-top:5px;padding:5px 8px;
 border-radius:99px;background:#34241c;color:#f2bd78;font-size:10px
}

.rewardBox{
 border:1px solid #4b5870;background:#10192a;
 border-radius:14px;padding:12px
}

.log{
 max-height:230px;overflow:auto;background:#080d15;
 border-radius:12px;padding:10px;font-size:12px
}
.log div{padding:7px 0;border-bottom:1px solid #172135}

.notice{
 position:fixed;z-index:100;left:50%;top:20px;
 transform:translateX(-50%);background:#eef3ff;color:#07101e;
 padding:11px 15px;border-radius:12px;display:none;
 font-weight:900;font-size:12px;box-shadow:0 10px 35px #0009;
 max-width:90%
}

.modal{
 position:fixed;inset:0;z-index:90;background:#000b;
 display:grid;place-items:center;padding:15px
}
.modalBox{width:100%;max-width:520px;max-height:90vh;overflow:auto}

.error{
 background:#170d12;border:1px solid #733844;
 border-radius:18px;padding:20px;color:#ffdfe3
}

@media(max-width:650px){
 .titleLogo{font-size:42px}
 h1{font-size:27px}
 .grid4{grid-template-columns:repeat(2,1fr)}
 .grid3{grid-template-columns:repeat(3,1fr)}
 .nav button{font-size:9px}
 .map{min-height:330px}
}
@media(max-width:430px){
 .grid{grid-template-columns:1fr}
 .choice{grid-template-columns:1fr}
 .grid3{grid-template-columns:repeat(2,1fr)}
 .titleLogo{font-size:36px;letter-spacing:5px}
}
</style>
</head>

function makeItem(name,type,qty,extra){
 return Object.assign({name:name,type:type,qty:qty||1,rarity:"Common"},extra||{});
}

function initializeInventory(){
 return [
  makeItem("Rusty Sword","Weapon",1,{rarity:"Common",atk:3}),
  makeItem("Traveler Clothes","Armor",1,{rarity:"Common",def:3}),
  makeItem("Small Potion","Potion",5,{rarity:"Common",heal:80}),
  makeItem("Small Ether","Potion",2,{rarity:"Common",mana:45}),
  makeItem("Bread","Food",2,{rarity:"Common",heal:40}),
  makeItem("Water","Drink",2,{rarity:"Common",mana:25})
 ];
}

function normalizeState(raw){
 const s=freshState();
 if(!raw||typeof raw!=="object")return s;

 Object.keys(s).forEach(k=>{
  if(raw[k]!==undefined)s[k]=raw[k];
 });

 s.stats=Object.assign(freshState().stats,raw.stats||{});
 s.computed=Object.assign(freshState().computed,raw.computed||{});
 s.equipment=Object.assign(freshState().equipment,raw.equipment||{});

 if(!Array.isArray(s.inventory)||!s.inventory.length)s.inventory=initializeInventory();
 if(!Array.isArray(s.unlockedSkills))s.unlockedSkills=[];
 if(!Array.isArray(s.equippedSkills))s.equippedSkills=[];
 if(!Array.isArray(s.completedQuests))s.completedQuests=[];
 if(!Array.isArray(s.dailyQuests))s.dailyQuests=[];
 if(!Array.isArray(s.logs))s.logs=[];
 if(!Array.isArray(s.achievements))s.achievements=[];
 if(!Array.isArray(s.titles))s.titles=[];
 if(!Array.isArray(s.custom))s.custom=[];

 return s;
}

let state;
let soundOn=true;
let audioCtx=null;
let currentScreen="home";
let battleTimer=null;

/* ---------- STORAGE ---------- */

function load(){
 try{
  const raw=JSON.parse(localStorage.getItem(SAVE_KEY)||"null");
  return normalizeState(raw);
 }catch(e){
  return freshState();
 }
}

function save(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify(state));

}

function resetGame(){
 if(confirm("Reset semua progress NEXORA?")){

/* ---------- UTIL ---------- */

function esc(value){
 return String(value??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
 }[m]));
}

function toast(text){
 const n=document.getElementById("notice");
 if(!n)return;
 n.textContent=text;
 n.style.display="block";
 clearTimeout(window.__toast);
 window.__toast=setTimeout(()=>n.style.display="none",2100);
}

function log(text){
 state.logs.unshift(text);
 state.logs=state.logs.slice(0,40);
 save();
}

function random(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

function clamp(n,min,max){
 return Math.max(min,Math.min(max,n));
}

function todayKey(){
 const d=new Date();
 return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

/* ---------- AUDIO ---------- */

function beep(freq=440,dur=.07,type="sine"){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=audioCtx||new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.value=.035;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();

  g.gain.exponentialRampToValueAtTime(
   .0001,audioCtx.currentTime+dur
  );
  o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}

function sfx(kind){
 if(kind==="hit")beep(120,.08,"sawtooth");
 else if(kind==="crit"){
  beep(500,.08);
  setTimeout(()=>beep(760,.1),60);
 }else if(kind==="win"){
  [440,550,660,800].forEach((f,i)=>setTimeout(()=>beep(f,.1),i*90));
 }else if(kind==="level"){
  [500,650,800,1000].forEach((f,i)=>setTimeout(()=>beep(f,.12),i*100));
 }else beep(300,.05);
}

/* ---------- STATS ---------- */

function recalc(){
 const r=RACES[state.race]||RACES.Human;
 const c=CLASSES[state.class]||CLASSES.Warrior;
 const s=state.stats||{str:5,vit:5,int:5,dex:5,luk:5};

 state.computed.maxHp=
  r.hp+c.hp+
  (state.level-1)*18+
  s.vit*14+
  state.rebirth*35;

 state.computed.maxMp=
  r.mp+c.mp+
  (state.level-1)*7+
  s.int*9;

 state.computed.atk=
  r.atk+c.atk+
  (state.level-1)*4+
  s.str*4+
  state.rebirth*3;

 state.computed.def=
  r.def+c.def+
  (state.level-1)*2+
  s.vit*2;

 state.computed.spd=
  r.spd+c.spd+
  (state.level-1)+
  s.dex*2;

 state.computed.luck=
  r.luck+
  Math.floor((state.level-1)/2)+
  s.luk*2;

 const weapon=findItem(state.equipment.weapon);
 const armor=findItem(state.equipment.armor);

 if(weapon)state.computed.atk+=Number(weapon.atk||0);
 if(armor)state.computed.def+=Number(armor.def||0);

 state.hp=clamp(
  state.hp||state.computed.maxHp,
  0,state.computed.maxHp
 );
 state.mp=clamp(
  state.mp||state.computed.maxMp,
  0,state.computed.maxMp
 );
}

function xpNeed(){
 return Math.floor(
  180+
  state.level*125+
  state.level*state.level*22
 );
}

function gainXP(amount){
 amount=Math.max(0,Math.floor(amount));
 state.xp+=amount;

 let levels=0;

 while(state.xp>=xpNeed()){
  state.xp-=xpNeed();
  state.level++;
  state.statPoints+=6;
  levels++;
  recalc();
  state.hp=state.computed.maxHp;
  state.mp=state.computed.maxMp;
  sfx("level");
  log("Naik ke Level "+state.level+". +6 Stat Point.");
 }

 if(levels){
  toast("✨ LEVEL UP! Lv "+state.level+" • +"+levels*6+" Stat Point");
 }

 updateRank();
 checkAchievements();
 save();
}

function spendStat(stat){
 if(state.statPoints<=0){
  toast("Stat Point habis.");
  return;
 }

 if(!["str","vit","int","dex","luk"].includes(stat))return;

 state.stats[stat]++;
 state.statPoints--;
 recalc();

 if(stat==="vit")state.hp=Math.min(state.computed.maxHp,state.hp+14);
 if(stat==="int")state.mp=Math.min(state.computed.maxMp,state.mp+9);

 save();
 render(currentScreen);
 toast("+"+stat.toUpperCase()+" berhasil.");
}

function updateRank(){
 const r=state.reputation;
 state.rank=
  r>=1600?"S":
  r>=1100?"A":
  r>=750?"B":
  r>=450?"C":
  r>=220?"D":
  r>=80?"E":"F";
}

function findItem(name){

}

function addItem(name,type,qty,extra){
 let item=findItem(name);

 if(item){
  item.qty+=qty;
 }else{
  state.inventory.push(makeItem(name,type,qty,extra));
 }

 save();
}

function removeItem(name,qty){
 const item=findItem(name);
 if(!item||item.qty<qty)return false;

 item.qty-=qty;
 if(item.qty<=0){
  state.inventory=state.inventory.filter(x=>x!==item);
 }
 save();
 return true;
}

function hasItem(name,qty=1){
 const i=findItem(name);
 return !!i&&i.qty>=qty;
}

function generateDailyQuests(){
 const stamp=todayKey();

 if(state.dailyStamp===stamp&&state.dailyQuests.length)return;

 const seed=new Date().getDate()+new Date().getMonth()*31;
 const list=[];

 for(let i=0;i<6;i++){
  const q=QUEST_TYPES[(seed+i*3)%QUEST_TYPES.length];
  const hard=i>=4;
  const names=q.names;
  const name=names[(seed+i)%names.length];

  let amount=hard?8+(i*2):3+i;

  list.push({
   id:"D"+stamp+"_"+i,
   name:name,
   type:q.type,
   area:q.zone,
   desc:
    q.type==="Hunt"?"Kalahkan "+amount+" monster.":
    q.type==="Gather"?"Kumpulkan "+amount+" material.",
    level:hard?12+i*2:2+i,
    rep:hard?45:18,
    xp:hard?3000+i*500:650+i*180,
    gold:hard?1100+i*200:220+i*80,
    target:amount
  });
 }

 state.dailyQuests=list;
 state.dailyStamp=stamp;
 save();
}

/* ---------- QUEST ---------- */

function allQuests(){
 generateDailyQuests();
 return MAIN_QUESTS.concat(state.dailyQuests);
}

function questDone(id){
 return state.completedQuests.includes(id);
}

function questCanStart(q){
 if(questDone(q.id))return false;
 if(state.activeQuest)return false;
 if(state.level<(q.level||1))return false;

 if(q.kills&&state.kills<q.kills)return false;

 if(q.item){
  if(!hasItem(q.item[0],q.item[1]))return false;
 }

 return true;
}

function acceptQuest(id){
 const q=allQuests().find(x=>x.id===id);
 if(!q)return;

 if(!questCanStart(q)){
  toast("Quest belum memenuhi syarat.");
  return;
 }

 state.activeQuest=id;
 log("Quest diterima: "+q.name);
 toast("📜 Quest diterima!");
 save();
 render("quests");
}

function checkActiveQuest(){
 const q=allQuests().find(x=>x.id===state.activeQuest);
 if(!q)return;

 let ready=true;

 if(q.kills&&state.kills<q.kills)ready=false;
 if(q.item&&!hasItem(q.item[0],q.item[1]))ready=false;
 if(q.monster&&!state.completedQuests.includes(q.id))ready=false;

 if(q.target){
  const count=state.kills;
  if(q.type==="Hunt"&&count<q.target)ready=false;
 }

 if(q.level&&state.level<q.level)ready=false;

 if(ready)finishQuest(q);
 else toast("Progress belum selesai.");
}

function finishQuest(q){
 if(!q||questDone(q.id))return;

 state.completedQuests.push(q.id);
 state.activeQuest=null;

 state.gold+=q.gold||0;
 state.reputation+=q.rep||0;

 gainXP(q.xp||0);

 log(
  "Quest selesai: "+q.name+
  " • +"+(q.xp||0)+" XP"+
  " • +"+(q.gold||0)+" Gold"+
  " • REP +"+(q.rep||0)
 );

 toast("📜 QUEST SELESAI!");
 sfx("win");
 checkAchievements();
 save();
 render("quests");
}

function attack(skillIndex){
 if(!state.combat)return;

 const c=state.combat;
 const e=c.enemy;

 if(battleTimer){
  toast("Tunggu giliran...");
  return;
 }

 let dmg=
  state.computed.atk+
  Math.floor(Math.random()*Math.max(4,state.computed.spd*.4));

 let crit=
  Math.random()<
  clamp(.06+state.computed.luck/500,.06,.45);

 if(skillIndex!==null){
  const skill=SKILLS[state.class][skillIndex];

  if(!skill){
   toast("Skill tidak ditemukan.");
   return;
  }

  if(state.level<skill.req){
   toast("Skill membutuhkan Lv "+skill.req+".");
   return;
  }

  if(state.mp<skill.cost){
   toast("MP tidak cukup.");
   return;
  }

  state.mp-=skill.cost;
  dmg=Math.floor(dmg*skill.mul);

  if(skill.crit){
   crit=Math.random()<
    clamp(.25+state.computed.luck/350,.25,.7);
  }

  if(skill.heal){
   state.hp=Math.min(
    state.computed.maxHp,
    state.hp+Math.floor(state.computed.maxHp*.08)
   );
  }

  if(skill.defBreak){
   e.def=Math.max(0,Math.floor(e.def*.75));
  }
 }

 if(crit)dmg=Math.floor(dmg*1.7);

 dmg=Math.max(1,dmg-Math.floor(e.def*.35));
 e.hp-=dmg;

 toast((crit?"💥 CRITICAL ":"")+"-"+dmg+" Damage");
 sfx(crit?"crit":"hit");

 if(e.hp<=0){
  winBattle();
  return;
 }

 save();
 render("combat");

 battleTimer=setTimeout(()=>{
  battleTimer=null;
  enemyTurn();
 },650);
}

function enemyTurn(){
 if(!state.combat)return;

 const e=state.combat.enemy;

 const dodgeChance=clamp(state.computed.spd/500,.02,.25);

 if(Math.random()<dodgeChance){
  log("Kamu menghindari serangan "+e.name+".");
  toast("💨 DODGE!");
  render("combat");
  return;
 }

 let dmg=
  e.atk+
  Math.floor(Math.random()*8)-
  Math.floor(state.computed.def*.32);

 dmg=Math.max(1,dmg);

 state.hp-=dmg;

 log(e.name+" menyerang • -"+dmg+" HP");
 sfx("hit");

 if(state.hp<=0){
  defeatBattle();
  return;
 }

 save();
 render("combat");
}

function winBattle(){
 if(!state.combat)return;

 const e=state.combat.enemy;

 let xp=e.xp;
 let gold=e.gold;

 if(state.foodBuff&&state.foodBuff.xp){
  xp=Math.floor(xp*(1+state.foodBuff.xp));
 }

 if(state.foodBuff&&state.foodBuff.gold){
  gold=Math.floor(gold*(1+state.foodBuff.gold));
 }

 state.gold+=gold;
 state.kills++;

 if(!state.combat.arena){
  state.reputation+=e.boss?60:4;
 }

 const drops=[];

 if(Array.isArray(e.drops)){
  e.drops.forEach(name=>{
   if(Math.random()<.72||e.boss){

  addItem("Arena Medal","Material",2);

 if(state.combat.dungeon){
  state.arenaTokens+=1;
 }

 state.lastReward={
  enemy:e.name,
  xp:xp,
  gold:gold,
  drops:drops
 };

 gainXP(xp);

 log(
  "MENANG melawan "+e.name+
  " • +"+xp+" XP • +"+gold+" Gold"
 );

 if(drops.length){
  log("Drop: "+drops.join(", "));

 state.combat=null;

 state.mp=Math.min(state.computed.maxMp,state.mp+Math.floor(state.computed.maxMp*.25));

/* ---------- SKILL TREE ---------- */

function toggleSkill(index){
 const skill=SKILLS[state.class][index];
 if(!skill)return;

 if(state.level<skill.req){
  toast("Butuh Lv "+skill.req+".");
  return;
 }

 const key=state.class+"_"+index;

 if(!state.unlockedSkills.includes(key)){
  state.unlockedSkills.push(key);
  toast("✨ Skill dibuka: "+skill.name);
 }else{
  const pos=state.equippedSkills.indexOf(key);

  if(pos>=0){
   state.equippedSkills.splice(pos,1);
   toast("Skill dilepas.");
  }else{
   if(state.equippedSkills.length>=4){
    toast("Maksimal 4 skill terpasang.");
    return;
   }
   state.equippedSkills.push(key);
   toast("Skill dipasang.");
  }
 }

 save();
 render("skills");
}

/* ---------- CREATOR ---------- */

function balanceScore(power,def){
 const score=Math.round(
  50+
  Number(power||0)*1.5+
  Number(def||0)*1.1
 );

 return {
  score:score,
  text:
   score<=85?"BALANCED":
   score<=120?"STRONG":
   score<=155?"OVERPOWERED":"EXTREME"
 };
}

function submitCreator(){
 const name=document.getElementById("customName").value.trim();

 if(!name){
  toast("Isi nama konten.");
  return;
 }

 const power=Number(document.getElementById("customPower").value)||0;
 const def=Number(document.getElementById("customDef").value)||0;
 const type=document.getElementById("customType").value;
 const desc=document.getElementById("customDesc").value.trim();

 const balance=balanceScore(power,def);

 state.custom.push({
  name:name,
  type:type,
  power:power,
  def:def,
  desc:desc,
  balance:balance.text,
  score:balance.score,
  status:"Pending",
  by:state.name
 });

 save();
 toast("📨 Konten dikirim ke Owner.");
 render("creator");
}

function moderate(index,approve){

}

/* ---------- RENDER ---------- */

function render(screen="home"){
 try{
  currentScreen=screen;

  const app=document.getElementById("app");
  const top=document.getElementById("topbar");

  if(!app||!top)return;

  top.classList.toggle("hidden",!state.started);

  const lv=document.getElementById("topLv");
  const rank=document.getElementById("topRank");

  if(lv)lv.textContent=state.level;
  if(rank)rank.textContent=state.rank;

  if(!state.started){
   app.innerHTML=titleHTML();
   bind();
   return;
  }

  generateDailyQuests();
  recalc();

  const screens={
   home:homeHTML,
   world:worldHTML,
   quests:questsHTML,
   status:statusHTML,
   inventory:inventoryHTML,
   combat:combatHTML,
   menu:menuHTML,
   skills:skillsHTML,
   blacksmith:blacksmithHTML,
   tavern:tavernHTML,
   market:marketHTML,
   gather:gatherHTML,
   achievements:achievementsHTML,
   settings:settingsHTML,
   creator:creatorHTML,
   owner:ownerHTML
  };

  app.innerHTML=(screens[screen]||homeHTML)();
  bind();

 }catch(err){
  showError(err);
 }
}

/* ---------- EVENT SYSTEM ---------- */

function bind(){
 document.querySelectorAll("[data-action]").forEach(el=>{
  el.addEventListener("click",()=>{
   const a=el.dataset.action;

   if(a==="home")render("home");
   else if(a==="world")render("world");
   else if(a==="quests")render("quests");
   else if(a==="status")render("status");
   else if(a==="inventory")render("inventory");
   else if(a==="menu")render("menu");
   else if(a==="skills")render("skills");
   else if(a==="blacksmith")render("blacksmith");
   else if(a==="tavern")render("tavern");
   else if(a==="market")render("market");
   else if(a==="gather")render("gather");
   else if(a==="achievements")render("achievements");
   else if(a==="settings")render("settings");
   else if(a==="creator")render("creator");
   else if(a==="owner")render("owner");
   else if(a==="newgame"){
    state=freshState();
    state.inventory=initializeInventory();
    renderCreate();
   }
   else if(a==="continue"){
    if(state.name){
     state.started=true;
     recalc();
     save();
     render("home");
    }else{
     renderCreate();
    }
   }
   else if(a==="create")createCharacter();
   else if(a==="rebirth")rebirth();
   else if(a==="checkquest")checkActiveQuest();
   else if(a==="battlepotion")useBattlePotion();
   else if(a==="flee")flee();
   else if(a==="rest")rest();
   else if(a==="repair")repair();
   else if(a==="upgrade")upgradeWeapon();
   else if(a==="sound"){
    soundOn=!soundOn;
    if(soundOn)beep(400,.05);
    render("settings");
   }
   else if(a==="reset")resetGame();
   else if(a==="submitcreator")submitCreator();
  });
 });

function renderCreate(){
 const app=document.getElementById("app");
 app.innerHTML=createHTML();

 let race=state.race;
 let cls=state.class;

 document.querySelectorAll("[data-race]").forEach(b=>{
  b.addEventListener("click",()=>{
   race=b.dataset.race;
   document.querySelectorAll("[data-race]").forEach(x=>x.classList.remove("selected"));
   b.classList.add("selected");
  });
 });

 document.querySelectorAll("[data-class]").forEach(b=>{
  b.addEventListener("click",()=>{
   cls=b.dataset.class;
   document.querySelectorAll("[data-class]").forEach(x=>x.classList.remove("selected"));
   b.classList.add("selected");
  });
 });

 const create=document.querySelector("[data-action='create']");
 if(create){
  create.addEventListener("click",()=>{
   const name=(document.getElementById("charName").value||"Nameless").trim();

   state.name=name||"Nameless";
   state.race=race;
   state.class=cls;
   state.started=true;
   state.inventory=initializeInventory();

   recalc();

   state.hp=state.computed.maxHp;
   state.mp=state.computed.maxMp;

   state.unlockedSkills=[state.class+"_0"];
   state.equippedSkills=[state.class+"_0"];

   log(state.name+" tiba di Astera.");
   save();
   sfx("win");
   render("home");
  });
 }
}

}

function buyMarket(index){
 const items=[
  ["Small Potion",30,"Potion",{heal:80}],
  ["Large Potion",90,"Potion",{heal:250}],
  ["Mega Potion",240,"Potion",{heal:700}],
  ["Small Ether",40,"Potion",{mana:45}],
  ["Large Ether",120,"Potion",{mana:180}],
  ["Antidote",55,"Potion",{heal:30}],
  ["Teleport Stone",150,"Utility",{}],
  ["Dungeon Key",500,"Material",{}]
 ];

 const x=items[index];
 if(!x)return;

 if(state.gold<x[1]){
  toast("Gold tidak cukup.");
  return;
 }

 state.gold-=x[1];

 addItem(x[0],x[2],1,x[3]);

 toast("🛒 "+x[0]+" dibeli.");
 save();
 render("market");
}

/* ---------- ERROR GUARD ---------- */

function showError(err){
 const app=document.getElementById("app");

 if(!app)return;

 app.innerHTML=`
 <section class="error">
  <div class="eyebrow">NEXORA SYSTEM</div>
  <h1>⚠️ Game Error</h1>
  <p>
   Game mengalami error saat menjalankan bagian tertentu.
   Save kamu tidak langsung dihapus.
  </p>

  <p class="muted">
   ${esc(err&&err.message?err.message:String(err))}
  </p>

  <button class="btn" onclick="location.reload()">
   ↻ RELOAD GAME
  </button>

  <button class="btn alt" onclick="localStorage.removeItem('${SAVE_KEY}');location.reload()">
   ♻️ RESET SAVE
  </button>
 </section>`;
}

window.addEventListener("error",function(e){
 console.error(e.error||e.message);
});

window.addEventListener("unhandledrejection",function(e){
 console.error(e.reason);
});

/* ---------- BOOT ---------- */

try{
 state=load();

 if(state.started){
  recalc();
  generateDailyQuests();
 }

 render(state.started?"home":"home");
}catch(err){
 state=freshState();
 showError(err);
}

</script>
</body>
</html>
