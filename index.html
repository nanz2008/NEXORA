<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b12">
<title>NEXORA — Chronicles of Astera</title>
<style>
:root{
 --bg:#080a10;--panel:#111522;--panel2:#171c2b;--line:#2a3145;
 --text:#f2f4fa;--muted:#9da6ba;--gold:#e8bb62;--blue:#6fa8ff;
 --red:#ef6d78;--green:#65d69a;--purple:#ad83ff;--cyan:#65d8e8;
 --shadow:0 14px 40px rgba(0,0,0,.42);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:radial-gradient(circle at top,#171c31 0,#080a10 48%,#05060a 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100%}
button,input,select{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.screen{width:min(980px,100%);margin:auto;padding:18px 14px 90px}
.hidden{display:none!important}
.logo{
 font-weight:900;letter-spacing:5px;font-size:clamp(32px,8vw,66px);
 background:linear-gradient(90deg,#fff,#e8bb62,#a97cff);
 -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--muted);line-height:1.6}
.center{text-align:center}
.card{
 background:linear-gradient(145deg,rgba(24,29,44,.96),rgba(13,16,25,.96));
 border:1px solid var(--line);border-radius:18px;padding:16px;
 box-shadow:var(--shadow)
}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:620px){.g2,.g3{grid-template-columns:1fr}}
.btn{
 min-height:46px;border:1px solid #343d56;border-radius:13px;
 padding:10px 15px;background:#1a2030;color:var(--text);
 transition:.15s transform,.15s background,.15s border
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#7555d9,#a16de9);border-color:#9b78ee}
.btn.gold{background:linear-gradient(135deg,#8e681e,#c69a3c);border-color:#d5af5e;color:#fff}
.btn.red{background:#3b1820;border-color:#72303c}
.btn.green{background:#123527;border-color:#266a4b}
.btn.blue{background:#142944;border-color:#315e91}
.btn:disabled{opacity:.42;cursor:not-allowed}
.title{font-size:23px;font-weight:800;margin:0 0 5px}
.sectionTitle{font-size:16px;font-weight:800;margin:0 0 10px}
.badge{
 display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;
 background:#1b2131;border:1px solid var(--line);font-size:12px;color:#dbe1ef
}
.badge.gold{color:#f2ce7c}.badge.green{color:#7be3a8}.badge.red{color:#ff8c96}.badge.blue{color:#85b7ff}.badge.purple{color:#c5a6ff}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;gap:10px;align-items:center}
.spacer{height:12px}
.hero{
 min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;
 padding:25px
}
.heroBox{max-width:720px}
.heroArt{
 margin:0 auto 22px;width:min(410px,90vw);height:180px;position:relative;
 border-radius:24px;border:1px solid #333b54;overflow:hidden;
 background:linear-gradient(160deg,#222743,#0b0e18)
}
.moon{position:absolute;width:90px;height:90px;border-radius:50%;background:#eee2ba;right:48px;top:24px;box-shadow:0 0 35px #e8d59a88}
.mountain{position:absolute;bottom:-2px;left:0;width:100%;height:95px;background:#0b0d14;clip-path:polygon(0 100%,18% 45%,31% 76%,49% 25%,65% 70%,79% 38%,100% 100%)}
.sigil{position:absolute;left:34px;top:45px;font-size:62px;opacity:.72}
.form input,.form select{
 width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);
 background:#0d111b;color:#fff;outline:none
}
.form input:focus,.form select:focus{border-color:#8267db}
.choice{
 padding:14px;border-radius:15px;border:1px solid #30384f;background:#111624;
 text-align:left;min-height:82px;position:relative
}
.choice.selected{border-color:#a37bf0;background:linear-gradient(145deg,#241b3e,#131724);box-shadow:0 0 0 1px #8e67dc55}
.choice .name{font-weight:800}.choice .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.choice .mark{position:absolute;right:10px;top:10px;color:#bd9cff;display:none}
.choice.selected .mark{display:block}
.stat{
 display:flex;justify-content:space-between;align-items:center;padding:9px 0;
 border-bottom:1px solid #242a3b
}
.stat:last-child{border-bottom:0}
.statBtns button{width:34px;height:34px;padding:0}
.nav{
 position:fixed;bottom:0;left:0;right:0;background:rgba(8,10,16,.94);
 border-top:1px solid var(--line);backdrop-filter:blur(14px);z-index:30
}
.navInner{max-width:980px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{
 border:0;background:transparent;color:#7f899f;padding:9px 2px 10px;font-size:10px;min-height:58px
}
.nav button.active{color:#d9c6ff}
.navIcon{font-size:19px;display:block;margin-bottom:2px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(8,10,16,.91);backdrop-filter:blur(12px);padding:8px 0 12px;margin-bottom:10px}
.topStats{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:7px}
.mini{background:#101521;border:1px solid #242c40;border-radius:12px;padding:8px;font-size:11px}
.mini b{display:block;font-size:14px}
.bar{height:7px;border-radius:99px;background:#292f40;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#7d61dc,#b992ff)}
.bar.hp i{background:linear-gradient(90deg,#d14f63,#f18883)}
.bar.mp i{background:linear-gradient(90deg,#3e8bd6,#6fd4ed)}
.bar.xp i{background:linear-gradient(90deg,#bb8a36,#f0ce74)}
.locationArt{
 height:135px;border-radius:16px;margin-bottom:12px;position:relative;overflow:hidden;
 border:1px solid #30384c;background:linear-gradient(145deg,#222a3f,#0d111a)
}
.locationArt:after{content:"";position:absolute;left:0;right:0;bottom:0;height:55%;background:linear-gradient(transparent,#070910)}
.locationEmoji{position:absolute;font-size:60px;left:50%;top:50%;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 14px #000)}
.enemy{
 text-align:center;padding:14px;border-radius:18px;
 background:radial-gradient(circle at center,#392035,#171522 55%,#0c0e15);
 border:1px solid #49344b
}
.enemyIcon{font-size:80px;line-height:1.1;filter:drop-shadow(0 9px 12px #000)}
.hpText{font-size:13px;color:#ff9ba2}
.log{
 max-height:190px;overflow:auto;padding:9px;background:#0a0d14;border-radius:12px;
 border:1px solid #22283a;font-size:12px;line-height:1.55
}
.log div{padding:4px 0;border-bottom:1px solid #171c29}
.quest{border-left:3px solid #8666d8}
.quest.done{border-left-color:#56cb8e}
.quest.lock{opacity:.55}
.itemIcon{font-size:27px;width:42px;text-align:center}
.itemRow{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #252b3c}
.itemRow:last-child{border-bottom:0}
.itemInfo{flex:1;min-width:0}
.itemInfo b{display:block}.itemInfo small{color:var(--muted)}
.rarity-common{color:#c3c9d6}.rarity-uncommon{color:#72d89b}.rarity-rare{color:#75aaff}.rarity-epic{color:#bd83ff}.rarity-legendary{color:#f0bd5d}
.toast{
 position:fixed;left:50%;bottom:75px;transform:translateX(-50%) translateY(20px);
 opacity:0;pointer-events:none;background:#171d2c;border:1px solid #4a5570;
 padding:12px 15px;border-radius:13px;z-index:80;max-width:min(92vw,450px);
 transition:.22s;box-shadow:var(--shadow);font-size:13px
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{
 position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;
 padding:15px;z-index:70
}
.modalBox{width:min(620px,100%);max-height:88vh;overflow:auto;background:#111622;border:1px solid #343d55;border-radius:19px;padding:17px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:3px}
.tab{white-space:nowrap}
.small{font-size:12px}.muted{color:var(--muted)}
.danger{color:#ff8893}.success{color:#72e0a3}
.story{
 font-family:Georgia,serif;line-height:1.8;font-size:15px;color:#e7e1d5;
 background:linear-gradient(145deg,#171925,#10121a);padding:17px;border-radius:16px;border:1px solid #383447
}
.choiceNarr{
 width:100%;text-align:left;margin-top:9px;padding:13px;border-radius:13px;
 border:1px solid #373e54;background:#151b29;color:#fff
}
.choiceNarr:hover{border-color:#866de0}
hr{border:0;border-top:1px solid #252b3c;margin:14px 0}
</style>
</head>

function clone(x){return JSON.parse(JSON.stringify(x));}

function save(){
 try{localStorage.setItem(APP,JSON.stringify(state));}
 catch(e){}
}

function load(){
 try{
  const raw=localStorage.getItem(APP);
  if(!raw)return false;
  const parsed=JSON.parse(raw);
  if(!parsed || !parsed.player)return false;
  state=Object.assign(defaultState(),parsed);
  state.player=Object.assign(defaultState().player,parsed.player||{});
  state.inventory=parsed.inventory||{};
  state.settings=Object.assign(defaultState().settings,parsed.settings||{});
  state.quests=parsed.quests||[];
  state.storyLog=parsed.storyLog||[];
  state.activityLog=parsed.activityLog||[];
  state.achievements=parsed.achievements||[];
  return true;
 }catch(e){return false}
}

function esc(v){
 return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function itemData(name){return ITEMS.find(x=>x[0]===name)||null}
function weaponData(name){return WEAPONS.find(x=>x[0]===name)||null}
function armorData(name){return ARMORS.find(x=>x[0]===name)||null}
function foodData(name){return FOOD.find(x=>x[0]===name)||null}
function monsterData(id){return MONSTERS.find(x=>x.id===id)||MONSTERS[0]}
function locData(id){return LOCATIONS.find(x=>x.id===id)||LOCATIONS[0]}

function notify(msg){
 const el=document.getElementById("toast");
 if(!el)return;
 el.textContent=msg;
 el.classList.add("show");
 clearTimeout(notify.timer);
 notify.timer=setTimeout(()=>el.classList.remove("show"),2300);
}

function log(msg){
 state.activityLog.unshift(new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})+" — "+msg);
 state.activityLog=state.activityLog.slice(0,80);
}

function addItem(name,n=1){
 state.inventory[name]=(state.inventory[name]||0)+n;
 if(state.inventory[name]<=0)delete state.inventory[name];
}

function hasItem(name,n=1){return (state.inventory[name]||0)>=n}

function removeItem(name,n=1){
 if(!hasItem(name,n))return false;
 state.inventory[name]-=n;
 if(state.inventory[name]<=0)delete state.inventory[name];
 return true;
}

function xpProgress(){
 return Math.min(100,Math.round(state.player.xp/state.player.xpNext*100));
}

function levelUpCheck(){
 let count=0;
 while(state.player.xp>=state.player.xpNext && count<20){
  state.player.xp-=state.player.xpNext;
  state.player.level++;
  state.player.xpNext=Math.floor(100*Math.pow(1.18,state.player.level-1));
  state.player.statPoints+=6;
  state.player.maxHp+=12+state.player.vit*2;
  state.player.maxMp+=7+state.player.int;
  state.player.hp=state.player.maxHp;
  state.player.mp=state.player.maxMp;
  count++;
  log("Naik level! Level "+state.player.level+". Kamu mendapat 6 Stat Points.");
  notify("LEVEL UP! +"+"6 Stat Points");
 }
 if(count)checkAchievements();
}

function gainXP(n){
 state.player.xp+=Math.max(0,n);
 levelUpCheck();
}

function gainGold(n){
 state.player.gold=Math.max(0,state.player.gold+Math.floor(n));
}

function calcMax(){
 state.player.maxHp=100+(state.player.level-1)*12+state.player.vit*10;
 state.player.maxMp=60+(state.player.level-1)*7+state.player.int*6;
 state.player.hp=Math.min(state.player.hp,state.player.maxHp);
 state.player.mp=Math.min(state.player.mp,state.player.maxMp);
}

function playerAttack(){
 let p=state.player;
 let weapon=weaponData(p.equippedWeapon);
 let base=18+p.str*3+p.level*4+(weapon?weapon[4]:0);
 return base;
}
function playerDefense(){
 let p=state.player;
 let armor=armorData(p.equippedArmor);
 return p.vit*2+p.level*2+(armor?armor[4]:0);
}
function magicPower(){
 return 15+state.player.int*4+state.player.level*3;
}

function questProgress(type,amount=1,extra={}){
 generateQuests();
 for(const q of state.quests){
  if(q.done)continue;
  let hit=false;
  if(q.type===type)hit=true;
  if(q.type==="hunt"&&extra.monster===q.targetMonster)hit=true;
  if(q.type==="gather"&&extra.item===q.targetItem)hit=true;
  if(q.type==="reality"){
   if(extra.reality===false)continue;
   if(type==="kill"&&q.title.includes("Night Watch"))hit=true;
   if(type==="travel"&&q.title.includes("Road Walker"))hit=true;
   if(type==="gather"&&q.title.includes("Resource Run"))hit=true;
   if(extra.questDone&&q.title.includes("Federation Challenge"))hit=true;
  }
  if(!hit)continue;
  q.progress=Math.min(q.target,q.progress+amount);
  if(q.progress>=q.target)completeQuest(q);
 }
 save();
}

function completeQuest(q){
 if(q.done)return;
 q.done=true;
 state.player.questsDone++;
 const r=q.reward||{};
 gainXP(r.xp||0);gainGold(r.gold||0);
 state.player.reputation+=r.rep||0;
 state.player.arenaTokens+=r.tokens||0;
 if(Math.random()<.25)addItem("Federation Seal",1);
 log("Quest selesai: "+q.title+" | EXP +"+(r.xp||0)+" | Gold +"+(r.gold||0));
 notify("QUEST SELESAI: "+q.title);
 questProgress("questDone",1,{questDone:true});
 checkAchievements();
 save();
}

/* ---------- actions ---------- */

function travel(id){
 const l=locData(id);
 const p=state.player;
 if(p.location===id){notify("Kamu sudah berada di "+l.name+".");return}
 if(p.reputation<l.need){notify("Butuh Reputation "+l.need+".");return}
 if(p.gold<l.travel){notify("Gold tidak cukup untuk perjalanan.");return}
 p.gold-=l.travel;
 p.location=id;
 p.flags[id]=true;
 questProgress("travel",1);
 log("Bepergian menuju "+l.name+" (-"+l.travel+" Gold).");
 save();render();
}

function useItem(name){
 if(!hasItem(name))return;
 const d=itemData(name);
 if(!d)return;
 let msg="";
 if(name==="Small Potion"){state.player.hp=Math.min(state.player.maxHp,state.player.hp+60);msg="+60 HP"}
 else if(name==="Potion"){state.player.hp=Math.min(state.player.maxHp,state.player.hp+160);msg="+160 HP"}
 else if(name==="High Potion"){state.player.hp=Math.min(state.player.maxHp,state.player.hp+350);msg="+350 HP"}
 else if(name==="Mega Potion"){state.player.hp=Math.min(state.player.maxHp,state.player.hp+700);msg="+700 HP"}
 else if(name==="Ether"){state.player.mp=Math.min(state.player.maxMp,state.player.mp+90);msg="+90 MP"}
 else if(name==="High Ether"){state.player.mp=Math.min(state.player.maxMp,state.player.mp+220);msg="+220 MP"}
 else if(name==="Elixir"){state.player.hp=Math.min(state.player.maxHp,state.player.hp+500);state.player.mp=Math.min(state.player.maxMp,state.player.mp+300);msg="Recovery"}
 else {msg="Item digunakan."}
 if(msg){removeItem(name);notify(name+" digunakan · "+msg);save();render()}
}

function learnSkill(id){
 const s=SKILLS.find(x=>x.id===id);
 if(!s)return;
 if(state.player.skills.includes(id)){notify("Skill sudah dipelajari.");return}
 if(state.player.level<(s.level||1)){notify("Level belum cukup.");return}
 state.player.skills.push(id);
 notify("Skill dipelajari: "+s.name);
 log("Mempelajari skill "+s.name+".");
 save();render();
}

function toggleSkill(id){
 const p=state.player;
 if(p.activeSkills.includes(id)){
  p.activeSkills=p.activeSkills.filter(x=>x!==id);
 }else{
  if(p.activeSkills.length>=4){notify("Maksimal 4 skill aktif.");return}
  if(!p.skills.includes(id)){notify("Pelajari skill terlebih dahulu.");return}
  p.activeSkills.push(id);
 }
 save();render();
}

function allocateStat(k){
 const p=state.player;
 if(p.statPoints<=0)return;
 if(!["str","agi","int","vit"].includes(k))return;
 p[k]++;
 p.statPoints--;
 calcMax();
 if(k==="vit")p.hp=Math.min(p.maxHp,p.hp+10);
 if(k==="int")p.mp=Math.min(p.maxMp,p.mp+6);
 save();render();
}

/* ---------- combat ---------- */

function chooseEnemy(){
 const p=state.player;
 const possible=MONSTERS.filter(m=>{
  const loc=p.location;
  const min=loc==="whisper"?1:loc==="ironmine"?5:loc==="mistmarsh"?8:loc==="suncoast"?10:loc==="ancientruins"?12:loc==="crimsoncanyon"?15:loc==="abyssgate"?18:loc==="skyreach"?22:1;
  return m.level>=min && m.level<=p.level+4;
 });
 return possible[Math.floor(Math.random()*possible.length)]||MONSTERS[0];
}

function startBattle(mode="hunt"){
 if(battle){notify("Pertarungan sedang berlangsung.");return}
 if(state.player.hp<=0){state.player.hp=Math.floor(state.player.maxHp*.5);state.player.mp=Math.floor(state.player.maxMp*.5)}
 const enemy=chooseEnemy();
 battle={enemyId:enemy.id,mode,enemyHp:enemy.hp,turn:1,guard:false};
 showBattle();
}

function battleDamage(skill=null){
 const p=state.player,e=battle.enemy;
 let dmg;
 if(!skill)dmg=playerAttack();
 else{
  if(p.mp<skill.cost){notify("MP tidak cukup.");return null}
  p.mp-=skill.cost;
  if(skill.type==="Magic")dmg=Math.floor(magicPower()*(1.3+(skill.cost/300)));
  else if(skill.type==="Support")return skill;
  else dmg=Math.floor(playerAttack()*(1.2+skill.cost/250));
 }
 const crit=Math.random()<(p.agi*.006);
 if(crit)dmg=Math.floor(dmg*1.65);
 dmg=Math.max(1,dmg-e.def*.35);
 if(battle.enemyWeak)dmg=Math.floor(dmg*1.2);
 return {dmg:Math.floor(dmg),crit};
}

function playerTurn(skillId=null){
 if(!battle)return;
 const e=battle.enemy;
 const p=state.player;
 let skill=skillId?SKILLS.find(x=>x.id===skillId):null;
 const result=battleDamage(skill);
 if(result===null)return;
 if(result && result.name){
  if(result.type==="Support"){
   p.hp=Math.min(p.maxHp,p.hp+Math.floor(p.maxHp*.3));
   p.mp=Math.min(p.maxMp,p.mp+25);
   log("Menggunakan skill support.");
  }
 }else{
  battle.enemyHp=Math.max(0,battle.enemyHp-result.dmg);
  log((skill?skill.name:"Basic Attack")+" mengenai "+e.name+" sebesar "+result.dmg+(result.crit?" CRIT!":""));
 }
 if(battle.enemyHp<=0){winBattle();return}
 enemyTurn();
 showBattle();
}

function enemyTurn(){
 const p=state.player,e=battle.enemy;
 const raw=e.atk-(playerDefense()*.3);
 let dmg=Math.max(1,Math.floor(raw*(battle.guard?.45:1)));
 p.hp=Math.max(0,p.hp-dmg);
 battle.guard=false;
 log(e.name+" menyerang balik sebesar "+dmg+".");
 if(p.hp<=0){
  const loss=Math.min(p.gold,Math.floor(p.gold*.08));
  p.gold-=loss;
  p.hp=Math.floor(p.maxHp*.35);
  p.mp=Math.floor(p.maxMp*.35);
  log("Kamu tumbang. Kehilangan "+loss+" Gold.");
  battle=null;
  notify("Kamu dikalahkan. Jangan menyerah.");
 }
}

function winBattle(){
 const e=battle.enemy;
 const p=state.player;
 const xp=e.xp;
 const gold=e.gold+Math.floor(Math.random()*Math.max(5,e.gold*.4));
 addItem(e.drop,1);
 p.kills++;
 gainXP(xp);
 gainGold(gold);
 questProgress("kill",1,{monster:e.id});
 questProgress("hunt",1,{monster:e.id});
 questProgress("gold",gold);
 if(e.id==="m16"){
  p.flags.abyssGuardian=true;
  p.reputation+=10;
 }
 const mode=battle.mode;
 if(mode==="arena"){
  p.arenaWins++;
  p.arenaTokens+=2;
  addItem("Arena Token",2);
  questProgress("arena",1);
 }
 if(mode==="dungeon"){
  p.dungeonWins++;
  addItem("Dungeon Key",1);
  questProgress("dungeon",1);
 }
 log("MENANG vs "+e.name+" | EXP +"+xp+" | Gold +"+gold+" | Drop: "+e.drop);
 battle=null;
 checkAchievements();
 save();
 showRewardModal(e,xp,gold);
}

function doActivity(type){

  if(p.gold<80){notify("Entry Arena 80 Gold.");return}
  p.gold-=80;startBattle("arena");return

  if(p.level<10){notify("Dungeon membutuhkan level 10.");return}
  if(p.gold<300){notify("Entry Dungeon 300 Gold.");return}
  p.gold-=300;startBattle("dungeon");return
 }
 const table={
  gather:["Blue Herb","Red Herb","Moonleaf","Mana Flower","Crystal Moss"],
  mine:["Iron Ore","Copper Ore","Silver Ore","Gold Ore","Mithril Ore","Ruby","Sapphire","Emerald","Amethyst"],

  forage:["Oak Wood","Pine Wood","Sunflower Herb","Moonleaf","Feather","Spider Silk","Driftwood"]
 };
 if(!table[type])return;
 const arr=table[type];
 const n=arr[Math.floor(Math.random()*arr.length)];
 const amount=1+Math.floor(Math.random()*3);
 addItem(n,amount);
 const xp=40+amount*15;

 questProgress("gather",amount,{item:n});
 questProgress("reality",amount,{reality:true});
 log("Aktivitas "+type+": mendapatkan "+amount+" "+n+" | EXP +"+xp);

 save();render();
}

function storyModal(){
 const stage=Math.min(STORY.length-1,Math.max(0,state.storyStage-1));
 const chapter=STORY[stage];
 const root=document.createElement("div");
 root.className="modal";
 root.innerHTML=`<div class="modalBox">
  <div class="between"><div><span class="badge purple">ARBITER</span><h2 class="title">Chronicles of Astera</h2></div><button class="btn" data-close>×</button></div>
  <div class="story">${esc(chapter.text)}</div>
  <div style="margin-top:10px">${chapter.choices.map((c,i)=>`<button class="choiceNarr" data-choice="${i}">${i+1}. ${esc(c.t)}</button>`).join("")}</div>
  <p class="small muted" style="margin-top:12px">Pilihan dapat mengubah reputasi, Gold, flag cerita, dan event berikutnya.</p>
 </div>`;
 document.body.appendChild(root);
 root.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){root.remove();return}
  const c=e.target.closest("[data-choice]");
  if(!c)return;
  const choice=chapter.choices[Number(c.dataset.choice)];
  applyStoryChoice(choice);
  root.remove();
 });
}

function applyStoryChoice(choice){
 const e=choice.effect||{};
 state.player.reputation+=e.rep||0;
 state.player.reputation=Math.max(0,state.player.reputation);
 state.player.gold=Math.max(0,state.player.gold+(e.gold||0));
 if(e.flag)state.player.flags[e.flag]=true;
 state.storyStage=Math.min(STORY.length,state.storyStage+1);
 state.storyLog.push(choice.next);
 log("Arbiter Choice: "+choice.t);
 gainXP(100);
 notify("Pilihan tercatat dalam Chronicle.");
 save();render();
 if(state.settings.aiEnabled)aiArbiter(choice.next);
}

async function aiArbiter(context){
 const s=state.settings;
 if(!s.aiEndpoint||!s.aiKey)return;
 try{
  const prompt=`Kamu adalah Arbiter RPG NEXORA. Tulis narasi fantasy singkat 80-120 kata berdasarkan keputusan player ini: ${context}. Jangan mengontrol keputusan player berikutnya. Buat dunia merespons secara masuk akal.`;
  const res=await fetch(s.aiEndpoint,{
   method:"POST",
   headers:{"Content-Type":"application/json","Authorization:"Bearer "+s.aiKey},
   body:JSON.stringify({model:s.aiModel||"gpt-4o-mini",messages:[{role:"user",content:prompt}],temperature:.8})
  });
  if(!res.ok)throw new Error("HTTP "+res.status);
  const data=await res.json();
  const text=data?.choices?.[0]?.message?.content||data?.output_text||"";
  if(text){
   state.storyLog.push(text);
   log("AI Arbiter menambahkan narasi.");
   save();
  }
 }catch(e){
  log("AI Arbiter tidak tersedia; Local Arbiter tetap aktif.");
  save();
 }
}

/* ---------- shop ---------- */

function shopModal(){
 const root=document.createElement("div");
 root.className="modal";
 root.innerHTML=`<div class="modalBox">
  <div class="between"><h2 class="title">Golden Market</h2><span class="badge gold">🪙 ${state.player.gold}</span></div>
  <div class="tabs">
   <button class="btn tab" data-shop="consumable">Potion</button>
   <button class="btn tab" data-shop="food">Food</button>
   <button class="btn tab" data-shop="weapon">Weapons</button>
   <button class="btn tab" data-shop="armor">Armor</button>
  </div>
  <div id="shopContent" style="margin-top:12px"></div>
  <button class="btn" data-close style="width:100%;margin-top:12px">Kembali</button>
 </div>`;
 document.body.appendChild(root);

 function draw(type){
  let html="";
  if(type==="consumable"){
   const arr=ITEMS.filter(x=>x[3]==="consumable");
   html=arr.map(x=>shopRow(x[0],x[1],x[2],x[4],x[5],"item")).join("");
  }else if(type==="food"){
   html=FOOD.map(x=>shopRow(x[0],x[1],"common",x[2],`HP +${x[3]} · MP +${x[4]}`,"food")).join("");
  }else if(type==="weapon"){
   html=WEAPONS.map(x=>shopRow(x[0],x[1],x[2],x[5],"ATK +"+x[4],"weapon")).join("");
  }else{
   html=ARMORS.map(x=>shopRow(x[0],x[1],x[2],x[5],"DEF +"+x[4],"armor")).join("");
  }
  root.querySelector("#shopContent").innerHTML=html;
 }
 draw("consumable");

 root.addEventListener("click",e=>{
  const tab=e.target.closest("[data-shop]");
  if(tab)draw(tab.dataset.shop);
  const buy=e.target.closest("[data-buy]");
  if(buy)buyItem(buy.dataset.buy,buy.dataset.kind);
  if(e.target.closest("[data-close]"))root.remove();
 });
}

function shopRow(name,icon,rarity,price,desc,kind){
 return `<div class="itemRow"><div class="itemIcon">${icon}</div><div class="itemInfo"><b class="rarity-${rarity}">${esc(name)}</b><small>${esc(desc)} · ${price}G</small></div><button class="btn gold" data-buy="${esc(name)}" data-kind="${kind}">Buy</button></div>`;
}

function buyItem(name,kind){
 const p=state.player;
 let price=0;
 if(kind==="item"){price=itemData(name)?.[4]||0}
 if(kind==="food"){price=foodData(name)?.[2]||0}
 if(kind==="weapon"){price=weaponData(name)?.[5]||0}
 if(kind==="armor"){price=armorData(name)?.[5]||0}
 if(p.gold<price){notify("Gold tidak cukup.");return}
 p.gold-=price;
 if(kind==="item"||kind==="food")addItem(name,1);
 else if(kind==="weapon"){p.equippedWeapon=name;notify("Weapon dibeli dan dipasang.");}
 else if(kind==="armor"){p.equippedArmor=name;notify("Armor dibeli dan dipasang.");}
 log("Membeli "+name+" seharga "+price+" Gold.");
 save();
 notify("Purchased: "+name);
}

function equipmentModal(){
 const root=document.createElement("div");
 root.className="modal";
 root.innerHTML=`<div class="modalBox">
  <div class="between"><h2 class="title">Equipment</h2><button class="btn" data-close>×</button></div>
  <section class="card"><b>⚔️ Weapon</b><p>${state.player.equippedWeapon||"Belum ada"}</p></section>
  <section class="card" style="margin-top:9px"><b>🛡️ Armor</b><p>${state.player.equippedArmor||"Belum ada"}</p></section>
  <div class="spacer"></div>
  <button class="btn gold" data-upgrade style="width:100%">⚒️ Upgrade Equipped</button>
  <p class="small muted">Upgrade menggunakan Gold + material. Setiap upgrade meningkatkan equipment.</p>
 </div>`;
 document.body.appendChild(root);
 root.addEventListener("click",e=>{
  if(e.target.closest("[data-close]"))root.remove();
  if(e.target.closest("[data-upgrade]"))upgradeEquipment();
 });
}

function upgradeEquipment(){
 const p=state.player;
 if(!p.equippedWeapon&&!p.equippedArmor){notify("Belum ada equipment.");return}
 const cost=250+p.level*80;
 if(p.gold<cost){notify("Gold tidak cukup. Butuh "+cost+"G.");return}
 p.gold-=cost;
 p.flags.upgrades=(p.flags.upgrades||0)+1;
 gainXP(100);
 log("Equipment berhasil di-upgrade.");
 notify("Equipment Upgrade berhasil!");
 save();
 equipmentModal();
}

  <div class="between"><h2 class="title">Moonlit Tavern</h2><button class="btn" data-close>×</button></div>
  <p class="sub">Tavern bukan hanya tempat istirahat. Makanan memberi pemulihan dan bonus perjalanan.</p>
  <div class="grid">${FOOD.map(x=>`

function eatFood(name){
 const f=foodData(name);if(!f)return;
 if(state.player.gold<f[2]){notify("Gold tidak cukup.");return}
 state.player.gold-=f[2];
 state.player.hp=Math.min(state.player.maxHp,state.player.hp+f[3]);
 state.player.mp=Math.min(state.player.maxMp,state.player.mp+f[4]);
 log("Makan "+name+".");
 notify(name+" memberikan efek.");
 save();render();
}

 root.className="modal";
 root.innerHTML=`<div class="modalBox">

 root.className="modal";
 root.innerHTML=`<div class="modalBox"><div class="between"><h2 class="title">Activity Log</h2><button class="btn" data-close>×</button></div><div class="log">${state.activityLog.map(x=>`<div>${esc(x)}</div>`).join("")}</div></div>`;

function resetConfirm(){
 const ok=confirm("Reset seluruh save NEXORA di perangkat ini?");
 if(!ok)return;
 localStorage.removeItem(APP);
 state=defaultState();
 setupStep=1;selectedRace="";selectedClass="";
 currentView="home";render();
}

/* ---------- global event delegation ---------- */

document.addEventListener("click",function(e){
 const navBtn=e.target.closest("[data-nav]");
 if(navBtn){
  if(battle){notify("Selesaikan pertarungan dahulu.");return}
  currentView=navBtn.dataset.nav;
  render();
  return;
 }

 const race=e.target.closest(".raceChoice");
 if(race){
  selectedRace=race.dataset.id;
  renderSetup();
  return;
 }

 const cls=e.target.closest(".classChoice");
 if(cls){
  selectedClass=cls.dataset.id;
  renderSetup();
  return;
 }

 if(e.target.closest("#toRace")){
  const input=document.getElementById("playerName");
  if(!input||!input.value.trim()){notify("Nama player wajib diisi.");return}
  window.__newName=input.value.trim();
  setupStep=2;renderSetup();return;
 }

 if(e.target.closest("#backSetup")){setupStep=1;renderSetup();return}
 if(e.target.closest("#toClass")){setupStep=3;renderSetup();return}
 if(e.target.closest("#backRace")){setupStep=2;renderSetup();return}
 if(e.target.closest("#createCharacter")){
  const oldName=window.__newName||"";
  createCharacterWithName(oldName);return;
 }

 const loc=e.target.closest("[data-location]");
 if(loc){travel(loc.dataset.location);return}

 const use=e.target.closest("[data-use]");
 if(use){useItem(use.dataset.use);return}

 const stat=e.target.closest("[data-stat]");
 if(stat){allocateStat(stat.dataset.stat);return}

 const skill=e.target.closest("[data-skill]");
 if(skill){toggleSkill(skill.dataset.skill);return}

 const learn=e.target.closest("[data-learn]");
 if(learn){learnSkill(learn.dataset.learn);return}

 const bskill=e.target.closest("[data-battle-skill]");
 if(bskill){playerTurn(bskill.dataset.battleSkill);return}

 const b=e.target.closest("[data-battle]");
 if(b){
  if(b.dataset.battle==="attack")playerTurn();
  else if(b.dataset.battle==="guard"){
   battle.guard=true;enemyTurn();showBattle();
  }else if(b.dataset.battle==="escape"){
   if(Math.random()<.72){battle=null;notify("Berhasil melarikan diri.");render()}
   else{notify("Gagal kabur.");enemyTurn();showBattle()}
  }
  return;
 }

 const action=e.target.closest("[data-action]");
 if(action){
  const a=action.dataset.action;
  if(a==="story")storyModal();
  else if(a==="federation")federationModal();
  else if(a==="activity")activityModal();
  else if(a==="settings")settingsModal();
  else if(a==="log")activityLogModal();
  else if(a==="refreshQuest"){generateQuests(true);render();notify("Kontrak diperbarui.");}
  else if(a==="shop")shopModal();
  else if(a==="equipment")equipmentModal();
  else if(a==="resetConfirm")resetConfirm();
  return;
 }

 const act=e.target.closest("[data-activity]");
 if(act){doActivity(act.dataset.activity);return}
});

function createCharacterWithName(name){
 const inputName=name||"";
 if(!inputName){setupStep=1;renderSetup();notify("Nama player wajib diisi.");return}
 const race=RACES.find(x=>x.id===selectedRace);
 const cls=CLASSES.find(x=>x.id===selectedClass);
 if(!race||!cls){notify("Race dan class belum dipilih.");return}
 state=defaultState();
 state.started=true;
 state.player.name=inputName;
 state.player.race=race.id;
 state.player.class=cls.id;
 for(const b of [race.bonus,cls.bonus])for(const k in b)state.player[k]+=b[k];
 state.player.maxHp=100+state.player.vit*10;
 state.player.maxMp=60+state.player.int*6;
 state.player.hp=state.player.maxHp;
 state.player.mp=state.player.maxMp;
 state.player.skills=["s0","s1","s2","s3","s4"];
 state.player.activeSkills=["s0","s2","s3","s4"];
 state.player.flags={astara:true,plaza:true};
 state.storyStage=1;
 state.storyLog=[
  "Gerbang Astera terbuka. "+inputName+" resmi terdaftar sebagai petualang Federasi.",
  "Tidak ada jalan yang sepenuhnya ditentukan. Pilihanmu akan membentuk Chronicle."
 ];
 generateQuests(true);
 log("Karakter baru dibuat: "+inputName+" / "+race.name+" / "+cls.name);
 save();
 currentView="home";
 render();
 notify("Petualangan dimulai!");
}

const oldRender=render;
render=function(){

 const app=document.getElementById("app");
 const loc=state.player.location;
 if(loc==="tavern"){
  const sec=app.querySelector(".screen");
  if(sec){
   const box=document.createElement("div");
   box.className="card";
   box.style.marginTop="12px";

   sec.appendChild(box);
  }
 }
 if(loc==="blacksmith"){
  const sec=app.querySelector(".screen");
  if(sec){
   const box=document.createElement("div");box.className="card";box.style.marginTop="12px";
   box.innerHTML=`<div class="between"><div><b>⚒️ Ironheart Forge</b><div class="small muted">Weapons, armor, upgrade.</div></div><button class="btn gold" data-action="shop">Forge</button></div>`;

 }

   box.innerHTML=`<div class="between"><div><b>🛒 Golden Market</b><div class="small muted">Potion, equipment, food.</div></div><button class="btn gold" data-action="shop">Shop</button></div>`;
   sec.appendChild(box);
  }
 }
};

/* ---------- safe boot ---------- */

(function boot(){
 const has=load();
 if(has && state.started){
  currentView="home";
  render();
 }else{
  state=defaultState();
  setupStep=1;
  renderSetup();
 }
})();
</script>
