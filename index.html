/* ---------- SAFE UTILITIES ---------- */

function num(v,f=0){
  const n=Number(v);
  return Number.isFinite(n)?n:f;
}
function int(v,f=0){
  return Math.floor(num(v,f));
}
function pos(v,f=0){
  return Math.max(0,num(v,f));
}
function money(v){
  return Math.floor(pos(v)).toLocaleString("id-ID");
}
function text(v,f=""){
  return v===null||v===undefined?f:String(v);
}
function esc(v){
  return text(v).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m];
  });
}
function clamp(v,a,b){
  return Math.max(a,Math.min(b,num(v,a)));
}
function rand(min,max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}
function $(id){
  return document.getElementById(id);
}

function normalizeState(raw){
 const d=freshState();
 const s=raw&&typeof raw==="object"?raw:{};
 const g=Object.assign({},d,s);

 g.name=text(s.name,"");
 g.race=RACES[s.race]?s.race:"Human";
 g.class=CLASSES[s.class]?s.class:"Warrior";
 g.level=Math.max(1,int(s.level,1));
 g.xp=pos(s.xp,0);
 g.gold=pos(s.gold,500);
 g.hp=pos(s.hp,100);
 g.mp=pos(s.mp,50);
 g.statPoints=Math.max(0,int(s.statPoints,6));
 g.rebirth=Math.max(0,int(s.rebirth,0));
 g.rebirthPoints=Math.max(0,int(s.rebirthPoints,0));
 g.reputation=Math.max(0,int(s.reputation,s.rep));
 g.rank=text(s.rank,"F");

 if(!s.stats||typeof s.stats!=="object")s.stats={};
 g.stats={
  str:Math.max(1,int(s.stats.str,10)),
  int:Math.max(1,int(s.stats.int,10)),
  vit:Math.max(1,int(s.stats.vit,10)),
  agi:Math.max(1,int(s.stats.agi,10)),
  luck:Math.max(0,int(s.stats.luck,5))
 };

 if(!s.inventory||Array.isArray(s.inventory)) {
   const old={};
   if(Array.isArray(s.inventory)){
    s.inventory.forEach(function(it){
      if(it&&it.name){
       const found=Object.keys(ITEMS).find(function(id){return ITEMS[id].name===it.name});
       if(found)old[found]=Math.max(0,int(it.qty||it.amount,1));
      }
    });
   }
   g.inventory=Object.keys(old).length?old:Object.assign({},d.inventory);
 }else{
   g.inventory={};
   Object.keys(s.inventory).forEach(function(id){
     if(ITEMS[id])g.inventory[id]=Math.max(0,int(s.inventory[id],0));
   });
   if(!Object.keys(g.inventory).length)g.inventory=Object.assign({},d.inventory);
 }

 if(!s.equipment||typeof s.equipment!=="object")g.equipment=Object.assign({},d.equipment);
 else{
  g.equipment={
   weapon:ITEMS[s.equipment.weapon]?s.equipment.weapon:(ITEMS[findItemIdByName(s.equipment.weapon)]?findItemIdByName(s.equipment.weapon):"weapon_0"),
   armor:ITEMS[s.equipment.armor]?s.equipment.armor:(ITEMS[findItemIdByName(s.equipment.armor)]?findItemIdByName(s.equipment.armor):"armor_0"),
   accessory:ITEMS[s.equipment.accessory]?s.equipment.accessory:null
  };
 }

 g.completed=Array.isArray(s.completed)?s.completed:[];
 g.unlockedSkills=Array.isArray(s.unlockedSkills)?s.unlockedSkills:[];
 g.equippedSkills=Array.isArray(s.equippedSkills)?s.equippedSkills:[];
 g.achievements=Array.isArray(s.achievements)?s.achievements:[];
 g.titles=Array.isArray(s.titles)?s.titles:[];
 g.logs=Array.isArray(s.logs)?s.logs.slice(0,40):d.logs;
 g.locationsVisited=Array.isArray(s.locationsVisited)&&s.locationsVisited.length?s.locationsVisited:["astera"];
 g.custom=Array.isArray(s.custom)?s.custom:[];
 g.buffs=Array.isArray(s.buffs)?s.buffs:[];
 g.questProgress=s.questProgress&&typeof s.questProgress==="object"?s.questProgress:{};
 g.activeQuest=s.activeQuest||null;
 g.questDay=text(s.questDay,"");
 g.dailyQuestIds=Array.isArray(s.dailyQuestIds)?s.dailyQuestIds:[];
 g.combat=null;

 if(!g.unlockedSkills.length){
   g.unlockedSkills=getClassSkills(g.class).slice(0,2);
 }
 if(!g.equippedSkills.length){
   g.equippedSkills=g.unlockedSkills.slice(0,4);
 }

 recalc();
 updateRank();
 return g;
}

function findItemIdByName(name){
 const n=text(name,"");
 return Object.keys(ITEMS).find(function(id){return ITEMS[id].name===n})||null;
}

function loadState(){

  return normalizeState(null);
 }catch(e){
  return normalizeState(null);
 }
}

/* ---------- AUDIO ---------- */

function beep(freq=440,dur=.08,type="sine"){
 if(!soundOn)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=audioCtx||new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const o=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  o.type=type;
  o.frequency.value=freq;
  gain.gain.value=.035;
  o.connect(gain);
  gain.connect(audioCtx.destination);
  o.start();
  gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
function sfx(kind){
 if(kind==="hit")beep(120,.08,"sawtooth");
 else if(kind==="crit"){beep(520,.07);setTimeout(function(){beep(760,.1)},60)}
 else if(kind==="win"){[440,560,680].forEach(function(f,i){setTimeout(function(){beep(f,.1)},i*90)})}
 else if(kind==="level"){[500,650,820].forEach(function(f,i){setTimeout(function(){beep(f,.12)},i*100)})}
 else if(kind==="quest"){beep(650,.08);setTimeout(function(){beep(900,.12)},80)}
 else beep(300,.05);
}
function toggleSound(){
 soundOn=!soundOn;
 const b=$("soundBtn");
 if(b)b.textContent=soundOn?"🔊":"🔇";
 if(soundOn)beep(700,.1);
}

function toast(msg){

 if(!t)return;
 t.textContent=text(msg);
 t.style.display="block";
 clearTimeout(toastTimer);
 toastTimer=setTimeout(function(){t.style.display="none"},2200);
}

/* ---------- STATS ---------- */

function getClassSkills(cls){
 return (SKILLS[cls]||[]).map(function(s){return s.id});
}

function recalc(){
 const r=RACES[state.race]||RACES.Human;
 const c=CLASSES[state.class]||CLASSES.Warrior;
 const w=ITEMS[state.equipment.weapon]||{};
 const a=ITEMS[state.equipment.armor]||{};
 const ac=ITEMS[state.equipment.accessory]||{};

 state.stats.maxHp=
   r.hp+c.hp+
   state.stats.vit*14+
   (state.level-1)*18+
   state.rebirth*40+
   num(a.hp,0);

 state.stats.maxMp=
   r.mp+c.mp+
   state.stats.int*8+
   (state.level-1)*7+
   num(ac.mana,0);

 state.stats.atk=
   r.str+c.str+
   state.stats.str*3+
   state.stats.int*1.4+
   (state.level-1)*3+
   num(w.atk,0)+
   num(ac.atk,0)+
   state.rebirth*4;

 state.stats.def=
   r.vit+c.vit+
   state.stats.vit*2.2+
   (state.level-1)*2+
   num(a.def,0)+
   state.rebirth*2;

 state.stats.spd=
   r.agi+c.agi+
   state.stats.agi+
   Math.floor((state.level-1)/2);

 state.stats.luck=
   r.luck+c.luck+
   state.stats.luck+
   num(ac.luck,0)+
   state.rebirth;

 state.stats.maxHp=Math.max(1,Math.floor(state.stats.maxHp));
 state.stats.maxMp=Math.max(1,Math.floor(state.stats.maxMp));
 state.stats.atk=Math.max(1,Math.floor(state.stats.atk));
 state.stats.def=Math.max(0,Math.floor(state.stats.def));
 state.stats.spd=Math.max(1,Math.floor(state.stats.spd));
 state.stats.luck=Math.max(0,Math.floor(state.stats.luck));

 state.hp=clamp(state.hp,state.hp<=0?0:1,state.stats.maxHp);
 state.mp=clamp(state.mp,0,state.stats.maxMp);

 if(state.started&&state.hp<=0)state.hp=Math.min(state.stats.maxHp,1);
}

function xpNeed(){
 return Math.floor(120+state.level*90+state.level*state.level*16);
}

function gainXP(amount){
 let n=pos(amount);
 if(n<=0)return;
 state.xp+=n;
 let leveled=0;
 while(state.xp>=xpNeed()&&state.level<100){
  state.xp-=xpNeed();
  state.level++;
  state.statPoints+=6;
  leveled++;
  recalc();
  state.hp=state.stats.maxHp;
  state.mp=state.stats.maxMp;
  state.unlockedSkills=unlockSkillsForLevel(state.unlockedSkills);
 }
 if(leveled){
  updateRank();
  toast("✨ LEVEL UP! Lv "+state.level+" • +"+(leveled*6)+" Stat Points");
  sfx("level");
  log("Naik level ke "+state.level+". Mendapat "+(leveled*6)+" Stat Points.");
 }
 save();
}

function unlockSkillsForLevel(current){
 const all=getClassSkills(state.class);
 const out=Array.isArray(current)?current.slice():[];
 all.forEach(function(id,i){
  const need=i===0?1:i===1?3:i===2?8:15;
  if(state.level>=need&&!out.includes(id))out.push(id);
 });
 return out;
}

function addStat(stat){
 if(state.statPoints<=0)return;
 if(!["str","int","vit","agi","luck"].includes(stat))return;
 state.stats[stat]++;
 state.statPoints--;
 recalc();
 save();
 render("status");
 toast("Stat "+stat.toUpperCase()+" +1");
}

function updateRank(){
 const r=pos(state.reputation);
 state.rank=r>=1800?"S+":r>=1200?"S":r>=800?"A":r>=500?"B":r>=300?"C":r>=160?"D":r>=70?"E":"F";
}

/* ---------- INVENTORY ---------- */

function itemQty(id){
 return Math.max(0,int(state.inventory[id],0));
}
function addItem(id,qty){
 if(!ITEMS[id])return;
 const q=Math.max(0,int(qty));
 if(q<=0)return;
 state.inventory[id]=itemQty(id)+q;
 state.materialsGathered+=ITEMS[id].type==="Material"?q:0;
}
function removeItem(id,qty){
 const q=Math.max(0,int(qty));
 if(itemQty(id)<q)return false;
 state.inventory[id]=itemQty(id)-q;
 if(state.inventory[id]<=0)delete state.inventory[id];
 return true;
}

function dayKey(){
 const d=new Date();
 return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function buildDailyQuests(){
 const key=dayKey();
 if(state.questDay===key&&state.dailyQuestIds.length)return;
 state.questDay=key;
 state.dailyQuestIds=[];
 const shuffled=QUEST_TEMPLATES.slice().sort(function(){return Math.random()-.5});
 shuffled.slice(0,8).forEach(function(t,i){
  const q={
   id:"daily_"+key+"_"+i,
   type:t[0],
   name:t[1],
   desc:t[2],
   level:1+Math.floor(Math.random()*Math.max(1,state.level)),
   rep:Math.max(0,t[8]),
   xp:t[6],
   gold:t[7],
   repReward:t[8],
   goal:{kind:t[3],value:t[4],amount:t[5]}
  };
  quests.push(q);
  state.dailyQuestIds.push(q.id);
 });
 save();
}

function refreshQuestList(){
 quests=STATIC_QUESTS.slice();
 buildDailyQuests();
 const daily=state.dailyQuestIds.map(function(id){
  return quests.find(function(q){return q.id===id});
 }).filter(Boolean);
 quests=STATIC_QUESTS.concat(daily);
}

function questCompleted(id){
 return state.completed.includes(id);
}

function questProgress(q){
 if(!q||!q.goal)return 0;
 const g=q.goal;
 if(g.kind==="kills")return state.kills;
 if(g.kind==="killsMonster")return int(state.questProgress["kill_"+g.value],0);
 if(g.kind==="boss")return int(state.questProgress["boss_"+g.value],0);
 if(g.kind==="item")return itemQty(g.value);
 if(g.kind==="craft")return int(state.questProgress["craft_"+g.value],0);
 if(g.kind==="locations")return state.locationsVisited.length;
 if(g.kind==="arena")return state.arenaWins;
 if(g.kind==="dungeonKills")return state.dungeonKills;
 if(g.kind==="visit")return state.locationsVisited.includes(g.value)?1:0;
 if(g.kind==="materials")return state.materialsGathered;
 if(g.kind==="goldEarned")return state.goldEarned;
 return 0;
}

function questReady(q){
 if(!q)return false;
 if(questCompleted(q.id))return false;
 if(state.level<pos(q.level,1))return false;
 if(state.reputation<pos(q.rep,0))return false;
 return true;
}

function acceptQuest(id){
 const q=quests.find(function(x){return x.id===id});
 if(!q||!questReady(q))return;
 if(state.activeQuest&&state.activeQuest!==id){
  toast("Selesaikan quest aktif terlebih dahulu.");
  return;
 }
 state.activeQuest=id;
 log("Quest diterima: "+q.name);
 save();
 sfx("quest");
 toast("📜 Quest diterima!");
 render("quests");
}

function checkQuest(){
 const q=quests.find(function(x){return x.id===state.activeQuest});
 if(!q)return;
 const amount=questProgress(q);
 const target=q.goal&&q.goal.amount?q.goal.amount:(q.goal&&q.goal.value&&typeof q.goal.value==="number"?q.goal.value:1);
 if(amount>=target)finishQuest(q);
 else toast("Progress: "+amount+"/"+target);
}

function finishQuest(q){
 if(!q||questCompleted(q.id))return;
 state.completed.push(q.id);
 state.activeQuest=null;
 state.gold+=pos(q.gold);
 state.goldEarned+=pos(q.gold);
 state.reputation+=pos(q.repReward);
 gainXP(q.xp);
 updateRank();
 grantAchievement("quest_"+q.type,"Quest "+q.type,"Menyelesaikan quest kategori "+q.type+".");
 log("Quest selesai: "+q.name+" • +"+money(q.xp)+" EXP • +"+money(q.gold)+" Gold • +"+q.repReward+" REP");
 toast("🏆 Quest selesai! +"+money(q.xp)+" EXP • +"+money(q.gold)+" Gold");
 sfx("quest");
 save();
}

function monsterForLocation(){
 const loc=state.location;
 const candidates=MONSTERS.filter(function(m){
  if(m.zone===loc)return true;
  if(loc==="forest"&&["forest"].includes(m.zone))return true;
  if(loc==="elvenwood"&&["forest","elvenwood"].includes(m.zone))return true;
  if(loc==="swamp"&&m.zone==="swamp")return true;
  if(loc==="ruincathedral"&&m.zone==="ruincathedral")return true;
  if(loc==="ashencanyon"&&m.zone==="ashencanyon")return true;
  if(loc==="oldgraveyard"&&m.zone==="oldgraveyard")return true;
  if(loc==="crystalcave"&&m.zone==="crystalcave")return true;
  if(loc==="dragonvalley"&&m.zone==="dragonvalley")return true;
  return false;
 });
 if(candidates.length)return pick(candidates);
 const available=MONSTERS.filter(function(m){return m.rec<=state.level+5&&!m.boss});
 return pick(available.length?available:MONSTERS.slice(0,3));
}

function startEncounter(forceBoss){
 if(state.combat)return;
 let e;
 if(forceBoss)e=MONSTERS.find(function(m){return m.id===forceBoss})||MONSTERS[11];
 else e=monsterForLocation();

 const scaled=Math.max(1,state.level-e.rec);
 const hp=Math.floor(e.hp*(1+Math.min(.25,scaled*.025)));
 const atk=Math.floor(e.atk*(1+Math.min(.2,scaled*.02)));

 state.combat={
  enemy:Object.assign({},e,{hp:hp,maxHp:hp,atk:atk,def:e.def}),
  arena:false,
  dungeon:["abyssgate","ancientdungeon","voidrift"].includes(state.location),
  boss:!!e.boss
 };

 log("Pertarungan dimulai melawan "+e.name+". Recommended Lv "+e.rec+".");
 save();
 render("combat");
 beep(90,.16,"sawtooth");
}

function startBoss(id){
 const m=MONSTERS.find(function(x){return x.id===id});
 if(!m)return;
 if(state.level<m.rec){
  toast("Boss membutuhkan Level "+m.rec+".");
  return;
 }
 startEncounter(id);
}

  hp:hp,
  maxHp:hp,
  atk:Math.floor((state.stats.atk*.72+state.stats.def*.35)),
  def:Math.floor(state.stats.def*.65),
  xp:Math.floor(500+state.level*130),
  gold:Math.floor(300+state.level*80),
  drops:[]
 };

 state.combat={enemy:e,arena:true,dungeon:false,boss:false};
 log("Duel Royal Arena dimulai. Biaya masuk 100 Gold.");
 save();
 render("combat");
}

function playerDamage(skill){
 let base=state.stats.atk+rand(0,Math.max(5,Math.floor(state.stats.atk*.12)));
 let critChance=.06+state.stats.luck/500+buffValue("crit")/100;
 let crit=Math.random()<critChance;

 if(skill){
  base*=num(skill.mul,1);
  crit=crit||Math.random()<num(skill.crit,0);
 }
 base+=buffValue("atk");
 if(Math.random()<.04)base*=1.15;
 if(crit)base*=1.7;

 return {damage:Math.max(1,Math.floor(base)),crit:crit};
}

function attack(skillId){
 if(!state.combat)return;

 const c=state.combat;
 const e=c.enemy;
 let skill=null;

 if(skillId){
  skill=(SKILLS[state.class]||[]).find(function(s){return s.id===skillId});
  if(!skill)return;
  if(!state.unlockedSkills.includes(skill.id)){
   toast("Skill belum terbuka.");
   return;
  }
  if(state.mp<skill.cost){
   toast("MP tidak cukup.");
   return;
  }
  state.mp-=skill.cost;
 }

 const result=playerDamage(skill);
 let damage=Math.max(1,result.damage-Math.floor(num(e.def)*.55));
 e.hp=Math.max(0,e.hp-damage);

 if(skill&&skill.heal){
  state.hp=Math.min(state.stats.maxHp,state.hp+Math.floor(state.stats.maxHp*skill.heal));
 }
 if(skill&&skill.defdown)e.def=Math.max(0,e.def-skill.defdown);

 sfx(result.crit?"crit":"hit");
 toast((result.crit?"💥 CRITICAL! ":"")+"-"+money(damage)+" damage");

 if(e.hp<=0){
  winBattle();
  return;
 }

 save();
 render("combat");

 clearTimeout(battleTimer);
 battleTimer=setTimeout(enemyTurn,500);
}

function enemyTurn(){
 if(!state.combat)return;

 const e=state.combat.enemy;
 const reduction=Math.floor(state.stats.def*.38);
 const damage=Math.max(1,e.atk+rand(0,Math.max(3,Math.floor(e.atk*.1)))-reduction);

 state.hp-=damage;
 sfx("hit");
 log(e.name+" menyerang. Kamu menerima "+damage+" damage.");

 if(state.hp<=0){
  defeatBattle();
  return;
 }

 save();
 render("combat");
}

function winBattle(){
 const c=state.combat;
 if(!c)return;
 const e=c.enemy;

 let xp=pos(e.xp);
 let gold=pos(e.gold);

 if(c.arena){
  xp=Math.floor(xp*(1+state.rebirth*.05));
  gold=Math.floor(gold*(1+state.rebirth*.05));
  state.arenaWins++;
 }else{
  state.kills++;
  if(e.boss)state.bossKills++;
  state.questProgress["kill_"+e.id]=int(state.questProgress["kill_"+e.id],0)+1;
  state.questProgress["boss_"+e.id]=int(state.questProgress["boss_"+e.id],0)+(e.boss?1:0);
  if(c.dungeon)state.dungeonKills++;
 }

 state.gold+=gold;
 state.goldEarned+=gold;

 gainXP(xp);

 const drops=[];
 (e.drops||[]).forEach(function(name){
  const id=findItemIdByName(name);
  if(id&&Math.random()<.72){
   addItem(id,1);
   drops.push(ITEMS[id].name+" x1");
  }
 });

 if(c.arena){
  const tokenId="arena_token";
  if(!ITEMS[tokenId])addItemDefArenaToken();
  addItem(tokenId,rand(1,3));
  drops.push("Arena Token x"+rand(1,3));
 }

 state.combat=null;
 consumeBattleBuffs();

 const dropText=drops.length?drops.join(", "):"Tidak ada drop tambahan.";

 log("MENANG melawan "+e.name+" • +"+money(xp)+" EXP • +"+money(gold)+" Gold • Drop: "+dropText);

 checkQuestAuto();
 checkAchievements();

 sfx("win");
 save();
 showRewardModal(e,xp,gold,drops);
}

}

/* ---------- ITEM USE ---------- */

function useItem(id,inBattle){
 const it=ITEMS[id];
 if(!it||itemQty(id)<=0)return;

 if(it.type==="Consumable"){
  if(it.heal){
   state.hp=Math.min(state.stats.maxHp,state.hp+it.heal);
  }
  if(it.mana){
   state.mp=Math.min(state.stats.maxMp,state.mp+it.mana);
  }
  if(it.revive&&state.hp>0){
   toast("Revival Feather hanya digunakan saat kalah.");
   return;
  }
  removeItem(id,1);
  toast(it.name+" digunakan.");
  log("Menggunakan "+it.name+".");
  save();
  if(inBattle)render("combat");else render("inventory");
  return;
 }

 if(it.type==="Food"){
  removeItem(id,1);
  if(id==="bread")state.hp=Math.min(state.stats.maxHp,state.hp+90);
  if(id==="meat")addBuff("atk",5,3);
  if(id==="fishmeal")addBuff("spd",5,3);
  if(id==="manaTea")addBuff("mp",40,3);
  if(id==="royalMeal"){state.hp=state.stats.maxHp;state.mp=state.stats.maxMp;addBuff("luck",5,3)}
  if(id==="dwarfAle")addBuff("def",8,3);
  if(id==="fairyCake")addBuff("crit",8,3);
  log("Menikmati "+it.name+".");
  save();
  render("inventory");
 }
}

function upgradeWeapon(){

 const w=ITEMS[id];
 if(!w)return;

/* ---------- CRAFT ---------- */

function canCraft(r){
 if(state.gold<r.cost)return false;
 return Object.keys(r.mats).every(function(id){return itemQty(id)>=r.mats[id]});
}

function craft(id){
 const r=RECIPES.find(function(x){return x.id===id});
 if(!r)return;
 if(!canCraft(r)){
  toast("Material atau Gold tidak cukup.");
  return;
 }
 state.gold-=r.cost;
 Object.keys(r.mats).forEach(function(mid){removeItem(mid,r.mats[mid])});
 addItem(r.result,r.qty);
 state.crafts++;
 state.questProgress["craft_"+r.result]=int(state.questProgress["craft_"+r.result],0)+r.qty;
 log("Craft "+r.name+" berhasil.");
 toast("🔧 Craft berhasil: "+r.name);
 checkQuestAuto();
 save();
 render("craft");
}

function balanceScore(type,power,def){
 let score=50+num(power)*1.8+num(def)*1.1;
 if(type==="Skill")score+=10;
 if(type==="Race")score+=8;
 if(type==="Weapon")score+=8;
 return Math.max(0,Math.min(150,Math.round(score)));
}

 state.custom.push({
  id:Date.now(),

  type:type,
  power:power,

  desc:desc,
